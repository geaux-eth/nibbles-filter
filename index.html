<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nibbles Filter</title>
<style>
:root{
  --bg:#fff4e6; --panel:#ffffff; --ink:#1d1b20; --muted:#6b6470; --line:#1d1b20;
  --accent:#ff7a7a; --accent2:#8fd8ff; --ok:#3bb273;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:3px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:20px;letter-spacing:.3px}
header h1 span{color:var(--accent)}
button,select,input{font:inherit;color:var(--ink)}
.btn{border:2.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .05s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent)}
.btn.blue{background:var(--accent2)}
.btn.rec{background:#ff4d4d;color:#fff}
.btn.small{padding:5px 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr;padding:12px}}
.stage-wrap{position:relative;background:#222;border:3px solid var(--line);border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#stage{display:block;max-width:100%;max-height:78vh;width:auto;height:auto}
.badge{position:absolute;top:10px;left:10px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.badge.live{background:#ff4d4d;color:#fff;left:auto;right:10px;display:none}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:14px;text-transform:uppercase;letter-spacing:.8px;margin:0 0 6px;color:var(--muted)}
.panel h3{font-size:12px;margin:8px 0 4px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--accent2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=number]{border:2px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff;width:110px}
.status{font-size:13px;color:var(--muted);min-height:18px}
.status.err{color:#c0392b}
.status.ok{color:var(--ok)}
.hint{font-size:12px;color:var(--muted)}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bgs .chip{text-align:center}
#dl{display:none}
body.streaming header, body.streaming .panel, body.streaming .badge{display:none!important}
body.streaming main{display:block;padding:0;max-width:none}
body.streaming .stage-wrap{border:0;border-radius:0;height:100vh;background:#000}
body.streaming #stage{max-height:100vh;max-width:100vw}
#exitStream{position:fixed;bottom:12px;right:12px;display:none;opacity:.15}
body.streaming #exitStream{display:block}
#exitStream:hover{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Nibbles <span>Filter</span></h1>
  <button class="btn blue small" id="walletBtn">Connect wallet</button>
</header>

<main>
  <section>
    <div class="stage-wrap">
      <canvas id="stage" width="1080" height="1080"></canvas>
      <div class="badge" id="trackBadge">Camera off</div>
      <div class="badge live" id="recBadge">● REC</div>
    </div>
    <video id="cam" playsinline muted style="display:none"></video>
  </section>

  <aside class="panel">
    <div>
      <h2>1 · Camera</h2>
      <div class="row">
        <button class="btn primary" id="camBtn">Start camera</button>
        <span class="status" id="camStatus"></span>
      </div>
    </div>

    <div>
      <h2>2 · Pick a Nibble</h2>
      <h3>The cast — anyone can use these</h3>
      <div class="chips" id="castChips"></div>
      <h3>Your Nibble (holders)</h3>
      <div class="chips" id="quick"></div>
      <div class="row" style="margin-top:8px">
        <input type="number" id="tokenInput" min="0" max="8887" placeholder="Token #">
        <button class="btn small" id="loadBtn">Load</button>
        <label class="btn small">Upload image<input type="file" id="fileInput" accept="image/*" hidden></label>
      </div>
      <div class="status" id="nibStatus"></div>
    </div>

    <div>
      <h2>3 · Background</h2>
      <div class="bgs" id="bgs"></div>
      <label class="btn small" style="margin-top:6px;display:inline-block">Custom background<input type="file" id="bgFile" accept="image/*" hidden></label>
    </div>

    <div>
      <h2>4 · Shape</h2>
      <div class="chips" id="aspects"></div>
    </div>

    <div>
      <h2>5 · Go</h2>
      <div class="row">
        <button class="btn rec" id="recBtn">Record</button>
        <button class="btn" id="streamBtn">Stream mode</button>
      </div>
      <div class="status" id="recStatus"></div>
      <a id="dl" class="btn small" download>Download clip</a>
      <p class="hint">Streaming: pick Green screen, hit Stream mode, then in OBS add a Window Capture of this browser and a Chroma Key filter.</p>
    </div>
  </aside>
</main>
<button class="btn small" id="exitStream">Exit stream mode</button>

<script type="module">
// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const CONTRACT = '0x5e52d41f0e40d7cdb204db0d09659846f7404547';
const RPC = 'https://ethereum-rpc.publicnode.com';
const META_URL = id => `https://frankymetadataserver-production.up.railway.app/nibble/metadata/${id}`;
const MP_VERSION = '0.10.14';
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

// The Nibbles cast, drawn from the official model sheets.
// h = where each expression head sits on the body (fractions of the body image): [x, y, w, h].
// Expressions: 0 angry, 1 talking/happy, 2 "oo", 3 heavy-lidded, 4 shocked.
const CAST = {
  ghost:  { name:'Ghost',   a:.7989, h:[[.3287,0,.5524,.4581],[.3357,0,.5455,.4581],[.3357,0,.5455,.4581],[.3357,0,.5455,.4581],[.3357,0,.5455,.4916]] },
  wolf:   { name:'Wolf',    a:.4979, h:[[.2521,0,.6639,.2971],[.2185,0,.7731,.3431],[.2185,0,.6891,.3096],[.2017,0,.7731,.2929],[.2521,0,.6891,.3682]] },
  bear:   { name:'Bear',    a:.7717, h:[[.3018,0,.4379,.3105],[.2959,0,.432,.3242],[.2959,.0046,.4379,.2922],[.2959,0,.4379,.2922],[.3018,0,.4379,.3836]] },
  beaver: { name:'Beaver',  a:.4896, h:[[.1441,0,.6356,.3485],[.1695,0,.6695,.3568],[.161,.0041,.678,.3651],[.161,.0041,.6695,.3485],[.1695,.0124,.678,.3734]] },
  gnome:  { name:'Gnome',   a:.6498, h:[[.1986,0,.5319,.4885],[.1915,0,.5319,.4885],[.1915,0,.5319,.4885],[.1844,0,.5603,.5023],[.1915,0,.5887,.5253]] },
  raccoon:{ name:'Raccoon', a:.6071, h:[[.1397,0,.7721,.3884],[.1471,0,.7647,.3884],[.1471,0,.7647,.3884],[.1618,.0223,.75,.3661],[.1176,0,.7941,.4955]] },
  gecko:  { name:'Gecko',   a:.4919, h:[[.281,0,.5785,.313],[.2893,0,.5785,.3293],[.2893,.0041,.5702,.3089],[.2893,0,.5702,.3211],[.2975,0,.5372,.3984]] },
  cock:   { name:'Cock',    a:.645,  h:[[.2752,0,.4362,.381],[.2953,0,.4295,.3896],[.2953,0,.4295,.3896],[.2953,0,.4295,.381],[.255,0,.5101,.5758]] },
};
// GEAUX's own Nibbles (token art; whole-art motion until each has its own expression frames)
const MY_NIBBLES = { 4075:'Ghost', 3133:'Wolf', 4248:'Bear', 5502:'Beaver', 4240:'Gnome', 8102:'Raccoon', 2525:'Gecko', 1353:'Cock' };

// Token Nibbles with drawn face layers (eyes and mouths line up with the token art at 1000x1000).
// eyes: 0 as-drawn, 1 angry, 2 surprised, 3 heavy-lidded, 4 closed
// mouths: 0 as-drawn, 1 closed (M B P), 2 slightly open, 3 wide "AH", 4 grin "EE", 5 round "O", 6 pucker "OO"
const FACES = { 4075: true };

const BONKD_BGS = { Meadow:'meadow', Woods:'woods', Mountain:'mountain', Canyon:'canyon', Desert:'desert', Harvest:'harvest' };
const BACKGROUNDS = ['Nibble color', ...Object.keys(BONKD_BGS), 'Green screen'];
const ASPECTS = { 'Square 1:1':[1080,1080], 'Vertical 9:16':[1080,1920], 'Wide 16:9':[1920,1080] };

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const stage = $('stage'), ctx = stage.getContext('2d');
const video = $('cam');
const S = {
  mode:null,                       // 'cast' | 'token'
  cast:null, castImgs:null,        // cast: key + loaded {body, e:[5]}
  tokenId:null, keyed:null, bgColor:'#ffbf85', verified:false,
  bg:'Nibble color', bgImg:null, account:null,
  landmarker:null, tracking:false, lastVideoTime:-1,
  face:{ roll:0, yaw:0, pitch:0, jaw:0, blink:0, brow:0, browUp:0, pucker:0, funnel:0, smile:0, press:0, seen:false },
  pitchBase:null, pitchSamples:[],
  expr:-1, exprSince:0, pop:0,
  face2:null, eyeIdx:-1, mouthIdx:-1, eyeSince:0, mouthSince:0,
  recorder:null, chunks:[], audioTracks:[],
};
window.__nibble = S;

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
function setStatus(el, msg, kind='') { const e = $(el); e.textContent = msg; e.className = 'status ' + kind; }
function mark(container, el) { document.querySelectorAll('#castChips .chip, #quick .chip').forEach(c => c.classList.toggle('on', c === el)); }

for (const [key, c] of Object.entries(CAST)) {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = c.name; b.dataset.cast = key;
  b.onclick = () => { mark(null, b); loadCast(key); };
  $('castChips').appendChild(b);
}
for (const [id, name] of Object.entries(MY_NIBBLES)) {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = `${name} #${id}`; b.dataset.id = id;
  b.onclick = () => { mark(null, b); loadToken(+id); };
  $('quick').appendChild(b);
}
const bgs = $('bgs');
const bgCache = {};
function bonkdBg(name) {
  if (!bgCache[name]) { const i = new Image(); i.src = `bg/${BONKD_BGS[name]}.webp`; bgCache[name] = i; }
  const i = bgCache[name]; return i.complete && i.naturalWidth ? i : null;
}
for (const name of BACKGROUNDS) {
  const b = document.createElement('button');
  b.className = 'chip' + (name === S.bg ? ' on' : ''); b.textContent = name;
  b.onclick = () => { S.bg = name; S.bgImg = null; if (BONKD_BGS[name]) bonkdBg(name); [...bgs.children].forEach(c => c.classList.toggle('on', c === b)); };
  bgs.appendChild(b);
}
for (const [name, [w,h]] of Object.entries(ASPECTS)) {
  const b = document.createElement('button');
  b.className = 'chip' + (h === w ? ' on' : ''); b.textContent = name;
  b.onclick = () => { if (S.recorder) return; stage.width = w; stage.height = h; [...$('aspects').children].forEach(c => c.classList.toggle('on', c === b)); };
  $('aspects').appendChild(b);
}

function loadImg(src, cors=false) {
  return new Promise((res, rej) => { const i = new Image(); if (cors) i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; });
}

// ---------------------------------------------------------------------------
// Cast characters (real drawn frames)
// ---------------------------------------------------------------------------
async function loadCast(key) {
  S.mode = 'cast'; S.cast = key; S.castImgs = null; S.expr = -1; S.tokenId = null; S.verified = false;
  setStatus('nibStatus', `Loading ${CAST[key].name}…`);
  try {
    const [body, ...e] = await Promise.all(['body','e0','e1','e2','e3','e4'].map(n => loadImg(`cast/${key}/${n}.webp`)));
    if (S.cast !== key) return;
    S.castImgs = { body, e };
    S.bgColor = '#ffbf85';
    setStatus('nibStatus', `${CAST[key].name} is ready.`, 'ok');
  } catch (e) { setStatus('nibStatus', 'Could not load that character.', 'err'); }
}

// Pick an expression frame from what your face is doing.
function chooseExpr(now) {
  const f = S.face;
  if (!(S.tracking && f.seen)) return -1;
  let want = -1;
  if (f.jaw > 0.6 || (f.jaw > 0.3 && f.browUp > 0.45)) want = 4;          // shocked
  else if (f.brow > 0.45) want = 0;                                      // angry
  else if (f.pucker > 0.5 && f.jaw < 0.3) want = 2;                      // "oo"
  else if (f.jaw > 0.12) want = 1;                                       // talking
  else if (f.blink > 0.55) want = 3;                                     // lids down
  // hold each face a beat so it reads, but let talking flap quickly
  const hold = (S.expr === 1 || want === 1) ? 70 : 140;
  if (want !== S.expr && now - S.exprSince > hold) { S.expr = want; S.exprSince = now; S.pop = 1; }
  return S.expr;
}

function drawCast(t) {
  const W = stage.width, H = stage.height, c = CAST[S.cast], im = S.castImgs;
  if (!im) return;
  const ref = c.h[2];                                   // frame the shot on the head
  const bodyH = (H * 0.42) / ref[3];                    // head fills ~42% of the frame height
  const bodyW = bodyH * c.a;
  const headCx = (ref[0] + ref[2]/2) * bodyW;
  const ox = W/2 - headCx, oy = H * 0.07;
  const f = S.face, live = S.tracking && f.seen;
  const roll = live ? f.roll : Math.sin(t/1400) * 0.04;
  const yaw = live ? f.yaw : 0, pitch = live ? f.pitch : 0;
  const breathe = Math.sin(t/650) * 0.008;
  const e = chooseExpr(t);
  S.pop = Math.max(0, S.pop - 0.15);
  const neckX = ox + headCx, neckY = oy + ref[3] * bodyH * 1.05;

  ctx.save();
  ctx.translate(neckX + yaw * W * 0.03, neckY + pitch * H * 0.02);
  ctx.rotate(Math.max(-.4, Math.min(.4, roll)) * 0.55);
  ctx.scale(1 + S.pop*0.02, 1 + breathe - S.pop*0.02);
  ctx.translate(-neckX, -neckY);
  ctx.drawImage(im.body, ox, oy, bodyW, bodyH);
  if (e >= 0) {
    const [hx, hy, hw, hh] = c.h[e];
    ctx.drawImage(im.e[e], ox + hx*bodyW, oy + hy*bodyH, hw*bodyW, hh*bodyH);
  }
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Token Nibbles (flat art) — the whole picture moves; nothing is cut apart
// ---------------------------------------------------------------------------
$('loadBtn').onclick = () => { const v = $('tokenInput').value; if (v !== '') loadToken(+v); };
$('tokenInput').onkeydown = e => { if (e.key === 'Enter') $('loadBtn').click(); };
$('fileInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const img = await loadImg(URL.createObjectURL(f));
  if (S.tokenId == null) S.tokenId = +($('tokenInput').value || 0);
  S.mode = 'token'; S.keyed = keyImage(img);
  if (!S.face2) loadFaces(S.tokenId);
  setStatus('nibStatus', `Using uploaded art for #${S.tokenId}.`, 'ok');
  await verifyOwnership();
};
function ipfs(u) { return u.startsWith('ipfs://') ? 'https://ipfs.io/ipfs/' + u.slice(7) : u; }
async function loadFaces(id) {
  S.face2 = null; S.eyeIdx = -1; S.mouthIdx = -1;
  if (!FACES[id]) return;
  try {
    const [eyes, mouths] = await Promise.all([
      Promise.all([0,1,2,3,4].map(i => loadImg(`faces/${id}/e${i}.webp`))),
      Promise.all([0,1,2,3,4,5,6].map(i => loadImg(`faces/${id}/m${i}.webp`))) ]);
    if (S.tokenId === id) S.face2 = { eyes, mouths };
  } catch (e) {}
}
async function loadToken(id) {
  if (!(id >= 0 && id <= 8887)) { setStatus('nibStatus', 'Token must be 0–8887.', 'err'); return; }
  S.mode = 'token'; S.tokenId = id; S.keyed = null; S.verified = false; S.cast = null;
  loadFaces(id);
  $('tokenInput').value = id;
  setStatus('nibStatus', `Loading Nibble #${id}…`);
  try {
    const meta = await (await fetch(META_URL(id))).json();
    S.keyed = keyImage(await loadImg(ipfs(meta.image), true));
    setStatus('nibStatus', `Loaded ${meta.name || 'Nibble #' + id}.`, 'ok');
  } catch (e) {
    setStatus('nibStatus', `Couldn't fetch #${id}'s art automatically — tap "Upload image" and pick your Nibble's picture.`, 'err');
  }
  await verifyOwnership();
}

// Remove the flat background by flood-filling from the top and sides.
function keyImage(img) {
  const N = 1000;
  const c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d', { willReadFrequently:true });
  g.drawImage(img, 0, 0, N, N);
  const d = g.getImageData(0, 0, N, N), p = d.data;
  const seed = [p[0], p[1], p[2]];
  S.bgColor = `rgb(${seed[0]},${seed[1]},${seed[2]})`;
  const removed = new Uint8Array(N*N), q = [];
  const dist = (o, r, gg, b) => Math.abs(p[o]-r) + Math.abs(p[o+1]-gg) + Math.abs(p[o+2]-b);
  const tryAdd = i => { if (!removed[i] && dist(i*4, seed[0], seed[1], seed[2]) < 40) { removed[i] = 1; q.push(i); } };
  for (let x = 0; x < N; x++) tryAdd(x);
  for (let y = 0; y < N; y++) { tryAdd(y*N); tryAdd(y*N + N-1); }
  while (q.length) {
    const i = q.pop(), x = i % N, y = (i / N) | 0, o = i*4;
    for (const j of [x>0 ? i-1 : -1, x<N-1 ? i+1 : -1, y>0 ? i-N : -1, y<N-1 ? i+N : -1]) {
      if (j < 0 || removed[j]) continue;
      if (dist(j*4, p[o], p[o+1], p[o+2]) < 30 && dist(j*4, seed[0], seed[1], seed[2]) < 90) { removed[j] = 1; q.push(j); }
    }
  }
  for (let i = 0; i < N*N; i++) if (removed[i]) p[i*4+3] = 0;
  for (let y = 1; y < N-1; y++) for (let x = 1; x < N-1; x++) {
    const i = y*N + x; if (removed[i]) continue;
    if ((removed[i-1] || removed[i+1] || removed[i-N] || removed[i+N]) && dist(i*4, seed[0], seed[1], seed[2]) < 200) p[i*4+3] = 120;
  }
  g.putImageData(d, 0, 0);
  return c;
}

// Eyes and mouth are separate: the mouth follows your lips, the eyes follow your blinks and brows.
function chooseFace(now) {
  const f = S.face;
  if (!(S.tracking && f.seen) || !S.face2) return [-1, -1];
  let e = -1;
  if (f.blink > 0.6) e = 4;
  else if (f.blink > 0.38) e = 3;
  else if (f.brow > 0.45) e = 1;
  else if (f.browUp > 0.5) e = 2;
  let m = -1;
  if (f.pucker > 0.5 && f.jaw < 0.25) m = 6;
  else if (f.jaw > 0.45) m = f.funnel > 0.3 ? 5 : 3;
  else if (f.smile > 0.45 && f.jaw > 0.06) m = 4;
  else if (f.jaw > 0.15) m = f.funnel > 0.35 ? 5 : 2;
  else if (f.jaw > 0.07) m = 2;
  else if (f.press > 0.35) m = 1;
  // blinks land instantly; other eye changes and mouth shapes hold briefly so they read
  if (e !== S.eyeIdx && (e === 4 || S.eyeIdx === 4 || now - S.eyeSince > 90)) { S.eyeIdx = e; S.eyeSince = now; }
  if (m !== S.mouthIdx && now - S.mouthSince > 45) { S.mouthIdx = m; S.mouthSince = now; }
  return [S.eyeIdx, S.mouthIdx];
}

function drawToken(t) {
  if (!S.keyed) return;
  const W = stage.width, H = stage.height, size = Math.min(W, H);
  const f = S.face, live = S.tracking && f.seen;
  const roll = live ? f.roll : Math.sin(t/1400) * 0.03;
  const yaw = live ? f.yaw : 0, pitch = live ? f.pitch : 0;
  const talk = live ? f.jaw * (S.face2 ? 0.3 : 1) : 0;   // less bounce once the mouth really moves
  const breathe = Math.sin(t/650) * 0.006;
  const px = W/2, py = H;                                // sway from the bottom, like a hand puppet
  ctx.save();
  ctx.translate(px + yaw * size * 0.03, py + pitch * size * 0.015);
  ctx.rotate(Math.max(-.4, Math.min(.4, roll)) * 0.35);
  ctx.scale(1 - Math.abs(yaw) * 0.04, 1 + breathe + talk * 0.035);
  ctx.translate(-px, -py);
  const x = (W - size)/2, y = H - size;
  ctx.drawImage(S.keyed, x, y, size, size);
  const [ei, mi] = chooseFace(t);
  if (ei >= 0) ctx.drawImage(S.face2.eyes[ei], x, y, size, size);
  if (mi >= 0) ctx.drawImage(S.face2.mouths[mi], x, y, size, size);
  ctx.drawImage(S.keyed, 0, 997, 1000, 3, x, H - 1, size, size * 0.3);   // body continues below the frame edge
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Wallet + ownership (Ethereum mainnet). Only token Nibbles are gated.
// ---------------------------------------------------------------------------
function setWalletBtn() { $('walletBtn').textContent = S.account ? `${S.account.slice(0,6)}…${S.account.slice(-4)} · Disconnect` : 'Connect wallet'; }
function disconnectWallet() {
  try { window.ethereum?.request({ method:'wallet_revokePermissions', params:[{ eth_accounts:{} }] }).catch(() => {}); } catch (e) {}
  S.account = null; S.verified = false;
  try { Object.keys(localStorage).filter(k => k.startsWith('verified:')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  setWalletBtn(); setStatus('nibStatus', 'Wallet disconnected.');
}
$('walletBtn').onclick = async () => {
  if (S.account) { disconnectWallet(); return; }
  if (!window.ethereum) { setStatus('nibStatus', 'No wallet found. On phone, open this page inside your wallet app\'s browser.', 'err'); return; }
  try {
    const [acct] = await window.ethereum.request({ method:'eth_requestAccounts' });
    S.account = acct.toLowerCase(); setWalletBtn();
    if (S.mode === 'token') await verifyOwnership();
  } catch (e) { setStatus('nibStatus', 'Wallet connection cancelled.', 'err'); }
};
window.ethereum?.on?.('accountsChanged', accts => {
  if (!accts || !accts.length) { disconnectWallet(); return; }
  S.account = accts[0].toLowerCase(); setWalletBtn(); if (S.mode === 'token') verifyOwnership();
});
async function ownerOf(id) {
  const data = '0x6352211e' + BigInt(id).toString(16).padStart(64,'0');
  const res = await fetch(RPC, { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ jsonrpc:'2.0', id:1, method:'eth_call', params:[{ to:CONTRACT, data }, 'latest'] }) });
  const j = await res.json();
  if (!j.result || j.result === '0x') throw new Error('ownerOf failed');
  return ('0x' + j.result.slice(-40)).toLowerCase();
}
function cachedVerify(id) {
  try { const v = JSON.parse(localStorage.getItem('verified:' + id) || 'null'); return v && Date.now() - v.at < 7*864e5 ? v : null; } catch (e) { return null; }
}
async function verifyOwnership() {
  S.verified = false;
  if (S.tokenId == null) return;
  if (!S.account) {
    const v = cachedVerify(S.tokenId);
    if (v) { S.verified = true; setStatus('nibStatus', `Verified #${S.tokenId} for ${v.account.slice(0,6)}…${v.account.slice(-4)}.`, 'ok'); }
    return;
  }
  try {
    const owner = await ownerOf(S.tokenId);
    S.verified = owner === S.account;
    try { if (S.verified) localStorage.setItem('verified:' + S.tokenId, JSON.stringify({ account:S.account, at:Date.now() })); } catch (e) {}
    setStatus('nibStatus', S.verified ? `Verified: you hold Nibble #${S.tokenId}.` : `Nibble #${S.tokenId} belongs to another wallet — preview only.`, S.verified ? 'ok' : 'err');
  } catch (e) { setStatus('nibStatus', 'Could not check ownership right now.', 'err'); }
}

// ---------------------------------------------------------------------------
// Camera + face tracking (MediaPipe Face Landmarker, on-device)
// ---------------------------------------------------------------------------
$('camBtn').onclick = async () => {
  try {
    setStatus('camStatus', 'Starting…');
    const vid = { facingMode:'user', width:{ideal:640}, height:{ideal:480} };
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video:vid, audio:{ echoCancellation:true, noiseSuppression:true } }); }
    catch (e) { stream = await navigator.mediaDevices.getUserMedia({ video:vid, audio:false }); }
    S.audioTracks = stream.getAudioTracks();
    video.srcObject = new MediaStream(stream.getVideoTracks()); await video.play();
    if (!S.landmarker) {
      setStatus('camStatus', 'Loading face tracker…');
      const vision = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.mjs`);
      const files = await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`);
      const opts = { baseOptions:{ modelAssetPath:MP_MODEL, delegate:'GPU' }, runningMode:'VIDEO', numFaces:1, outputFaceBlendshapes:true };
      try { S.landmarker = await vision.FaceLandmarker.createFromOptions(files, opts); }
      catch (e) { opts.baseOptions.delegate = 'CPU'; S.landmarker = await vision.FaceLandmarker.createFromOptions(files, opts); }
    }
    S.tracking = true;
    $('camBtn').textContent = 'Camera on'; $('camBtn').disabled = true;
    setStatus('camStatus', '');
  } catch (e) { setStatus('camStatus', 'Camera blocked or unavailable. Allow camera access and try again.', 'err'); }
};

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function track(now) {
  if (!S.tracking || !S.landmarker || video.readyState < 2 || video.currentTime === S.lastVideoTime) return;
  S.lastVideoTime = video.currentTime;
  const r = S.landmarker.detectForVideo(video, now), f = S.face;
  if (!r.faceLandmarks || !r.faceLandmarks.length) { f.seen = false; return; }
  f.seen = true;
  const L = r.faceLandmarks[0];
  const bs = {}; (r.faceBlendshapes?.[0]?.categories || []).forEach(c => bs[c.categoryName] = c.score);
  const roll = -Math.atan2(L[263].y - L[33].y, L[263].x - L[33].x);            // mirrored preview
  const yaw = -(((L[1].x - L[234].x) / ((L[454].x - L[234].x) || 1e-6)) - 0.5) * 2;
  const eyeY = (L[33].y + L[263].y) / 2, mouthY = (L[13].y + L[14].y) / 2;
  const t = (L[1].y - eyeY) / ((mouthY - eyeY) || 1e-6);
  if (S.pitchBase == null) { S.pitchSamples.push(t); if (S.pitchSamples.length > 20) S.pitchBase = S.pitchSamples.reduce((a,b)=>a+b)/S.pitchSamples.length; }
  const pitch = S.pitchBase == null ? 0 : clamp((t - S.pitchBase) * 3, -1, 1);
  f.roll = lerp(f.roll, roll, .5); f.yaw = lerp(f.yaw, clamp(yaw,-1,1), .5); f.pitch = lerp(f.pitch, pitch, .4);
  f.jaw = lerp(f.jaw, clamp(((bs.jawOpen || 0) - .04) * 1.6, 0, 1), .6);
  f.blink = lerp(f.blink, ((bs.eyeBlinkLeft || 0) + (bs.eyeBlinkRight || 0)) / 2, .7);
  f.brow = lerp(f.brow, ((bs.browDownLeft || 0) + (bs.browDownRight || 0)) / 2, .5);
  f.browUp = lerp(f.browUp, bs.browInnerUp || 0, .5);
  f.pucker = lerp(f.pucker, Math.max(bs.mouthPucker || 0, bs.mouthFunnel || 0), .5);
  f.funnel = lerp(f.funnel, bs.mouthFunnel || 0, .5);
  f.smile = lerp(f.smile, ((bs.mouthSmileLeft || 0) + (bs.mouthSmileRight || 0)) / 2, .5);
  f.press = lerp(f.press, ((bs.mouthPressLeft || 0) + (bs.mouthPressRight || 0)) / 2 + (bs.mouthRollLower || 0) * .5, .5);
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function drawCover(img) {
  const W = stage.width, H = stage.height, sc = Math.max(W / img.width, H / img.height);
  ctx.drawImage(img, (W - img.width*sc)/2, (H - img.height*sc)/2, img.width*sc, img.height*sc);
}
function drawBackground() {
  if (S.bgImg) { drawCover(S.bgImg); return; }
  const img = BONKD_BGS[S.bg] && bonkdBg(S.bg);
  if (img) { drawCover(img); return; }
  ctx.fillStyle = S.bg === 'Green screen' ? '#00ff00' : S.bgColor;
  ctx.fillRect(0, 0, stage.width, stage.height);
}
function drawWatermark() {
  if (S.mode !== 'token' || S.verified || !S.keyed) return;
  const W = stage.width, H = stage.height, fs = Math.min(W,H) * 0.035;
  ctx.save();
  ctx.font = `800 ${fs}px system-ui, sans-serif`; ctx.textAlign = 'center';
  ctx.lineWidth = 8; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d1b20'; ctx.fillStyle = '#fff';
  const msg = 'PREVIEW · connect the wallet that holds this Nibble';
  ctx.strokeText(msg, W/2, fs*2); ctx.fillText(msg, W/2, fs*2);
  ctx.restore();
}
function frame(now) {
  track(now);
  drawBackground();
  if (S.mode === 'cast') drawCast(now);
  else if (S.mode === 'token') drawToken(now);
  else {
    ctx.fillStyle = '#1d1b20'; ctx.textAlign = 'center';
    ctx.font = `800 ${Math.min(stage.width, stage.height)*0.05}px system-ui, sans-serif`;
    ctx.fillText('Pick a Nibble to begin', stage.width/2, stage.height/2);
  }
  drawWatermark();
  $('trackBadge').textContent = !S.tracking ? 'Camera off' : S.face.seen ? 'Tracking ✓' : 'Looking for your face…';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

$('bgFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  S.bgImg = await loadImg(URL.createObjectURL(f));
  [...bgs.children].forEach(c => c.classList.remove('on'));
};

// ---------------------------------------------------------------------------
// Recording
// ---------------------------------------------------------------------------
$('recBtn').onclick = () => {
  if (S.recorder) { try { S.recorder.stop(); } catch (e) {} return; }
  if (!S.mode) { setStatus('recStatus', 'Pick a Nibble first.', 'err'); return; }
  if (!stage.captureStream || !window.MediaRecorder) {
    setStatus('recStatus', 'This browser can\'t record. Open the page in Safari or Chrome — your verification carries over.', 'err'); return;
  }
  try {
    const out = stage.captureStream(30);
    (S.audioTracks || []).forEach(tr => { if (tr.readyState === 'live') out.addTrack(tr); });
    const mimeType = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    S.chunks = [];
    S.recorder = new MediaRecorder(out, mimeType ? { mimeType, videoBitsPerSecond:3_000_000 } : undefined);
    S.recorder.ondataavailable = e => e.data && e.data.size && S.chunks.push(e.data);
    S.recorder.onerror = () => { S.recorder = null; $('recBtn').textContent = 'Record'; $('recBadge').style.display = 'none'; setStatus('recStatus', 'Recording stopped unexpectedly.', 'err'); };
    S.recorder.onstop = () => {
      const type = (S.recorder && S.recorder.mimeType) || mimeType || 'video/webm';
      const blob = new Blob(S.chunks, { type });
      const name = `nibble-${S.cast || S.tokenId}-${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
      const dl = $('dl'); dl.href = URL.createObjectURL(blob); dl.download = name; dl.style.display = 'inline-block';
      S.recorder = null; $('recBtn').textContent = 'Record'; $('recBadge').style.display = 'none';
      setStatus('recStatus', 'Clip ready.', 'ok');
      let file = null; try { file = new File([blob], name, { type }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
        dl.onclick = async ev => { ev.preventDefault(); try { await navigator.share({ files:[file] }); } catch (e) {} };
      } else dl.onclick = null;
    };
    S.recorder.start(1000);
    $('recBtn').textContent = 'Stop'; $('recBadge').style.display = 'block'; $('dl').style.display = 'none';
    setStatus('recStatus', S.audioTracks && S.audioTracks.length ? 'Recording…' : 'Recording (no mic access, so no sound)…');
  } catch (e) { S.recorder = null; setStatus('recStatus', 'Recording isn\'t supported in this browser. Try Safari or Chrome.', 'err'); }
};

// ---------------------------------------------------------------------------
// Stream mode
// ---------------------------------------------------------------------------
$('streamBtn').onclick = async () => { document.body.classList.add('streaming'); try { await document.documentElement.requestFullscreen?.(); } catch (e) {} };
function exitStream() { document.body.classList.remove('streaming'); if (document.fullscreenElement) document.exitFullscreen(); }
$('exitStream').onclick = exitStream;
document.addEventListener('keydown', e => { if (e.key === 'Escape') exitStream(); });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('streaming'); });
</script>
