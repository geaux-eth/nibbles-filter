<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Luckiest+Guy&family=Bangers&family=Permanent+Marker&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">

<style>
@font-face{font-family:'Frankys';src:url(frankys.woff2) format('woff2');font-weight:400;font-display:swap}
:root{
  --page:#ffd23f; --paper:#ffffff; --ink:#161616; --line:#161616;
  --gold:#ffd23f; --red:#df3a4e; --green:#8ee26b; --sky:#9fe3fb; --cream:#fff3c4; --pink:#f48aa8; --ok:#8ee26b;
  --display:'Frankys','Lilita One','Arial Black',Impact,sans-serif; --body:'Baloo 2',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;color:var(--ink);font:600 15px/1.4 var(--body);
  background:var(--page)}
button,select,input{font:inherit;color:var(--ink)}

/* The whole app is one cartoon gadget: a white Bonkd card with an ink outline and a dark screen */
.device{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;
  width:calc(100% - 24px);max-width:640px;margin:max(10px,env(safe-area-inset-top)) auto max(12px,env(safe-area-inset-bottom));
  padding:12px var(--pad) 17px;background:var(--paper);border:3px solid var(--ink);border-radius:30px;box-shadow:5px 6px 0 var(--ink)}

header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 0 12px}
header .brand{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
header .logo{display:block;height:46px;width:auto}
header h1{margin:0;font:400 30px/1 var(--display);letter-spacing:.02em;display:flex;align-items:center;gap:6px;white-space:nowrap;
  color:var(--gold);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
header h1 span{font-size:15px;letter-spacing:.06em;color:#fff;-webkit-text-stroke:0;text-shadow:none;background:var(--red);border:2.5px solid var(--ink);
  border-radius:8px;padding:4px 7px 1px;box-shadow:2px 2px 0 var(--ink);transform:rotate(-6deg);display:inline-block;line-height:1}
header .credit{font:400 8.5px/1 var(--display);letter-spacing:.12em;color:var(--ink);opacity:.5;margin:3px 0 0 24px}
header .credit b{font-weight:400}

.toggle{flex:none;display:flex;align-items:center;gap:8px;font:400 13px/1 var(--display);letter-spacing:.03em;cursor:pointer;user-select:none;-webkit-user-select:none;
  background:var(--paper);border:2.5px solid var(--line);border-radius:999px;padding:4px 5px 4px 12px;box-shadow:2px 2px 0 var(--line)}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle i{position:relative;width:52px;height:30px;border:2.5px solid var(--line);border-radius:999px;background:#e8e3dc;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:1.5px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2.5px solid var(--line);box-sizing:border-box;transition:transform .15s}
.toggle input:checked + i{background:var(--gold)}
.toggle input:checked + i::after{transform:translateX(22px)}
.toggle input:focus-visible + i{outline:3px dashed var(--ink);outline-offset:2px}
.toggle.busy{opacity:.6}
/* both switches: white pill while off; on, the pill turns green and the track inside turns gold */
#camToggle,#txtToggle{background:var(--paper);color:var(--ink);transition:background .15s}
#camToggle.on,#txtToggle.on{background:var(--green)}
/* Safari paints a rounded box's fill square for a moment while it animates; keep every fill inside its outline */
.toggle,.aa,#txtIn,.pop,.chipb,.sw,.badge,.toast,.bezel,.device,.circ{background-clip:padding-box;isolation:isolate}
.toggle,.aa,.chipb{overflow:hidden}

/* the screen: ink bezel, the picture fitted inside it, a cartoon glint on the glass */
.bezel{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:7px;background:var(--ink);border-radius:22px}
#stage{display:block;width:0;height:0;border-radius:15px;background:#222;touch-action:none}
.glare{position:absolute;top:12px;left:12px;width:30px;height:30px;pointer-events:none;opacity:.8}
.badge{position:absolute;top:14px;right:14px;background:var(--red);color:#fff;border:2px solid var(--line);border-radius:8px;padding:4px 8px 1px;
  font:400 13px/1 var(--display);letter-spacing:.06em;box-shadow:2px 2px 0 var(--line);transform:rotate(4deg);display:none}
.toast{white-space:normal;position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:88%;background:#fff;border:2.5px solid var(--line);border-radius:14px;
  padding:8px 12px;font-size:13px;font-weight:700;text-align:center;box-shadow:3px 3px 0 var(--line);display:none;z-index:5}
.toast.err{background:#ffe1dc}
.toast .save{display:inline-block;white-space:nowrap;background:var(--red);color:#fff;text-decoration:none;border:2.5px solid var(--line);border-radius:999px;padding:7px 16px 4px;
  font:400 16px/1 var(--display);letter-spacing:.04em;vertical-align:middle;box-shadow:2px 2px 0 var(--line)}
.toast .close{display:inline-block;white-space:nowrap;color:var(--ink);text-decoration:none;font-size:18px;padding:4px 4px 4px 12px;vertical-align:middle}

/* text bar: a switch, a chat-style box (Enter puts it on screen), and the Aa style card.
   It sits above the screen so the phone keyboard never has to push the page up to reach it. */
.textbar{position:relative;flex:none;display:flex;align-items:center;gap:8px}
.textbar .toggle{padding:4px 4px 4px 10px;gap:6px;font-size:12px;letter-spacing:.02em}
.textbar .toggle i{width:44px;height:26px}
.textbar .toggle i::after{width:18px;height:18px}
.textbar .toggle input:checked + i::after{transform:translateX(18px)}
.txt-form{flex:1;min-width:0;display:flex}
#txtIn{flex:1;min-width:0;height:40px;padding:3px 12px 0;font:600 16px/1 var(--body);border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:2px 2px 0 var(--ink);outline:none}
#txtIn:focus{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink),0 0 0 3px var(--gold)}
#txtIn::placeholder{color:#8f887c}
#txtIn:disabled{background:#f3eee4;box-shadow:none;opacity:1}
.aa{flex:none;width:40px;height:40px;padding:2px 0 0;border:2.5px solid var(--ink);border-radius:12px;background:var(--gold);font:400 18px/1 'Lilita One',var(--display);letter-spacing:.02em;
  box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.aa:active,.aa.on{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.pop{position:absolute;left:0;right:0;top:calc(100% + 12px);z-index:10;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);
  padding:10px 14px 14px;display:grid;gap:4px}
.pop[hidden]{display:none}
.pop h4{margin:4px 0 2px;font:400 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (max-width:400px){ .tool{font-size:12px;letter-spacing:.01em} .pop{padding:8px 10px 12px} .chipb{font-size:15px;padding:6px 9px 4px} .chipb.seg{font-size:13px;padding:6px 9px 4px} .sw{width:26px;height:26px} .prow .sep{margin:0 1px} }
.chipb{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:6px 11px 4px;font-size:16px;line-height:1;cursor:pointer}
.chipb.on{background:var(--gold);box-shadow:2px 2px 0 var(--ink)}
.chipb.seg{font:400 12px/1 var(--display);letter-spacing:.02em;padding:7px 10px 5px}
.sw{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);padding:0;cursor:pointer}
.sw.on{box-shadow:0 0 0 2.5px var(--paper),0 0 0 5px var(--ink)}
.prow .sep{width:2px;height:22px;background:var(--ink);opacity:.2;margin:0 4px}

/* control dock: the bottom panel of the gadget, under a ruled line */
.bar{flex:none;margin:0 calc(-1 * var(--pad));padding:10px 8px 0;border-top:2.5px solid var(--ink)}
.dock{display:grid;grid-template-columns:1fr 1.3fr 1.2fr 1.15fr 1.15fr;align-items:end;max-width:460px;margin:0 auto}
.ctl{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.circ{display:block;flex:none;width:50px;height:50px;margin:5px 0 0;border-radius:50%;border:2.5px solid var(--line);background:#fff center/cover no-repeat;
  position:relative;padding:0;-webkit-appearance:none;appearance:none;cursor:pointer;overflow:hidden;box-shadow:2px 2px 0 var(--line);transition:transform .06s}
.ctl:active .circ{transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
.circ svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.lbl{display:block;max-width:100%;font:400 10px/1.15 var(--display);letter-spacing:.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px;-webkit-appearance:none;appearance:none}
.ctl.rec-c .circ{width:66px;height:66px;margin:0;border-width:3px;background:#fff;box-shadow:3px 3px 0 var(--line)}
.rec-dot{fill:var(--red)}
.rec-sq{fill:var(--red);display:none}
#recBtn.on .rec-dot{display:none}
#recBtn.on .rec-sq{display:inline}
#recBtn.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:3px 3px 0 var(--line),0 0 0 6px rgba(223,58,78,.25)}}
.shape-i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2.5px solid var(--line);border-radius:4px;background:var(--gold)}

@media (max-width:400px){
  .device{width:calc(100% - 18px);--pad:11px;padding-top:11px;border-radius:26px;box-shadow:4px 5px 0 var(--ink)}
  header{padding:0 10px 0 9px;gap:6px} header .logo{height:40px}
  .toggle{gap:6px;padding:3px 4px 3px 9px;font-size:12px} .toggle i{width:46px;height:27px} .toggle i::after{width:19px;height:19px} .toggle input:checked + i::after{transform:translateX(19px)}
}
@media (max-width:350px){
  header .logo{height:36px} header .credit{font-size:7.5px;margin-left:20px}
  .toggle{font-size:11px} .textbar .toggle{font-size:11px;padding-left:8px}
  .pop{padding:8px 8px 12px} .prow{gap:5px} .sw{width:24px;height:24px} .chipb.seg{padding:6px 8px 4px} .circ{width:44px;height:44px} .ctl.rec-c .circ{width:54px;height:54px} .lbl{font-size:8.5px} .bar{padding:8px 4px 0}
}

/* tools row: music, sound board, Nibble a Video */
.tools{position:relative;flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:400px;width:100%;margin:0 auto}
.tool{min-width:0;height:36px;padding:3px 6px 0;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:2px 2px 0 var(--ink);
  font:400 13px/1 var(--display);letter-spacing:.03em;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool.on{background:var(--gold)}
.tool:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.tool.hot{background:var(--red);color:#fff}
.tools .pop{top:auto;bottom:calc(100% + 10px)}
.trk{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--paper);padding:7px 10px 5px;
  font:400 14px/1.1 var(--display);letter-spacing:.02em;cursor:pointer}
.trk.on{background:var(--gold);box-shadow:2px 2px 0 var(--ink)}
.trk i{font-style:normal;width:16px;text-align:center}
.vol{width:100%;accent-color:var(--red)}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad{height:52px;border:2.5px solid var(--ink);border-radius:14px;background:var(--cream);box-shadow:2px 2px 0 var(--ink);font:400 13px/1 var(--display);letter-spacing:.03em;cursor:pointer;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pad:nth-child(4n+1){background:#ffe39a}.pad:nth-child(4n+2){background:#c9f0ff}.pad:nth-child(4n+3){background:#ffd0dc}.pad:nth-child(4n+4){background:#d6f5c4}
.pad:active,.pad.hit{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.note{font-size:12px;opacity:.7;margin:2px 0 0}
/* Nibble and background pickers: a grid of pictures, Nibbles grouped by kind first */
.pk{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(22,22,22,.45)}
.pk[hidden]{display:none}
@media (min-width:700px){ .pk{align-items:center} }
.pk-card{width:100%;max-width:520px;max-height:min(78dvh,680px);display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 6px 0 var(--ink);
  margin-bottom:env(safe-area-inset-bottom)}
.pk-head{flex:none;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;padding:10px 10px 8px;border-bottom:2.5px solid var(--ink)}
.pk-head h3{margin:0;text-align:center;font:400 21px/1 var(--display);letter-spacing:.03em}
.pk-b{width:38px;height:38px;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);font:700 20px/1 var(--body);cursor:pointer;padding:0}
.pk-b[hidden]{visibility:hidden;display:block}
.pk-grid{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px 10px;padding:14px 14px 18px}
.pk-t{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;cursor:pointer;min-width:0}
.pk-img{position:relative;width:100%;aspect-ratio:1;border:2.5px solid var(--ink);border-radius:16px;background:#eee center/cover no-repeat;box-shadow:2px 2px 0 var(--ink)}
.pk-t.on .pk-img{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--red)}
.pk-t:active .pk-img{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.pk-n{font:400 13px/1.1 var(--display);letter-spacing:.02em;text-align:center;max-width:100%;overflow-wrap:anywhere}
.pk-plus{display:flex;align-items:center;justify-content:center;background:var(--cream);font:400 54px/1 var(--display);color:var(--ink);border-style:dashed}
.pk-rm{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;background:#fff;font:700 13px/22px var(--body);text-align:center;cursor:pointer}
.pk-c{position:absolute;right:6px;bottom:6px;min-width:24px;height:24px;padding:3px 6px 0;border:2px solid var(--ink);border-radius:999px;background:var(--gold);font:400 13px/1 var(--display);text-align:center}

/* Nibble a Video window */
.vm{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(22,22,22,.45)}
.vm[hidden]{display:none}
.vm.rendering{align-items:flex-start;background:none;pointer-events:none}
.vm.rendering .vm-card{pointer-events:auto;margin-top:max(8px,env(safe-area-inset-top));padding:10px 14px 12px}
.vm.rendering .vm-x{display:none}
.vm-card{position:relative;width:100%;max-width:440px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 6px 0 var(--ink);padding:14px 16px 16px}
.vm-card h3{margin:2px 34px 8px 0;font:400 22px/1.05 var(--display);letter-spacing:.02em}
.vm-card p{margin:6px 0}
.vm-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);font:700 16px/1 var(--body);cursor:pointer}
.vm-go{display:block;width:100%;margin:12px 0 2px;padding:12px 14px 9px;border:3px solid var(--ink);border-radius:999px;background:var(--red);color:#fff;font:400 19px/1 var(--display);letter-spacing:.04em;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.vm-go:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.vm-bar{height:16px;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;background:#f3eee4;margin:8px 0}
.vm-bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.vm-cast{display:grid;gap:8px;margin:4px 0 8px}
.vm-person{display:grid;grid-template-columns:62px 18px 62px 1fr;align-items:center;gap:8px;font:400 18px/1 var(--display)}
.vm-face{width:62px;height:62px;border-radius:50%;border:2.5px solid var(--ink);background:#ddd;object-fit:cover}
.vm-nib{position:relative;display:block;width:62px;height:62px}
.vm-nib .circ{width:62px;height:62px;margin:0}
.vm-nib{border:0;background:none;padding:0;cursor:pointer}
.vm-person .lbl{font-size:13px;text-align:left}
.vm-tag{display:grid;gap:5px;justify-items:start;min-width:0}.vm-tag .chipb{font-size:11px;padding:6px 8px 4px}
.vm-row{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px}
.vm-h{margin:8px 0 6px;font:400 12px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase}.vm-h span{text-transform:none;font:600 12px/1.2 var(--body);letter-spacing:0;opacity:.65}
.vm-lines{display:grid;gap:6px;margin:0 0 10px;max-height:240px;overflow:auto;padding:2px}
.vm-line{display:grid;grid-template-columns:36px 74px 46px 1fr;align-items:center;gap:8px}
.vm-play{width:34px;height:34px;border:2.5px solid var(--ink);border-radius:50%;background:var(--paper);font:700 13px/1 var(--body);cursor:pointer;padding:0}
.vm-play.on{background:var(--gold)}
.vm-tm{font:600 13px/1 var(--body);opacity:.8}
.vm-lnib{width:44px;height:44px;margin:0}
.vm-out{display:block;width:100%;max-height:52dvh;border:2.5px solid var(--ink);border-radius:14px;background:#000;margin:4px 0 2px}
#vmSaveNote .save{display:inline-block;background:var(--red);color:#fff;text-decoration:none;border:2.5px solid var(--ink);border-radius:999px;padding:6px 14px 4px;font:400 15px/1 var(--display)}
.vm-opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.vm-opts label{display:grid;gap:4px;font:400 11px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.an-prev{display:flex;justify-content:center;margin:8px 0 0}.an-prev canvas{width:120px;height:120px;border:2.5px solid var(--ink);border-radius:16px}
.vm-opts input{width:100%;min-width:0;height:38px;padding:0 8px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);font:600 15px/1 var(--body)}
.an-lbl{display:grid;gap:4px;margin:8px 0;font:400 11px/1.2 var(--display);letter-spacing:.03em;text-transform:uppercase}
.an-lbl textarea{width:100%;padding:8px;border:2.5px solid var(--ink);border-radius:10px;font:600 14px/1.3 var(--body);text-transform:none;resize:vertical}
.an-p{margin:8px 0;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.an-ph{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--cream);border-bottom:2px solid var(--ink);font:400 14px/1 var(--display)}
.an-p pre{margin:0;padding:8px;max-height:96px;overflow:auto;white-space:pre-wrap;font:500 11.5px/1.35 ui-monospace,Menlo,monospace}
.an-up{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;padding:12px 14px;border:2.5px dashed var(--ink);border-radius:14px;cursor:pointer;font:400 15px/1.1 var(--display)}
.an-up b{font-weight:400;font-size:13px;padding:6px 10px 4px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.an-up.on{border-style:solid;background:#e3f7d6}
.an-chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:13px}
.an-sheet canvas{width:100%;height:auto;border:2.5px solid var(--ink);border-radius:12px;display:block}
.an-prob{margin:8px 0;padding-left:18px}.an-prob li{margin:4px 0}
@keyframes anPulse{50%{opacity:.4}}
.vm-opts select{width:100%;min-width:0;height:38px;padding:0 6px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);font:600 14px/1 var(--body)}

</style>

<body>
<div class="device">
  <header>

    <label class="toggle" id="camToggle"><span>Camera</span><input type="checkbox" id="camSwitch"><i></i></label>

  <div class="textbar">

    <button class="aa" id="aaBtn" type="button" aria-label="Text style" aria-expanded="false">Aa</button>
    <div class="pop" id="pop" hidden>
      <h4>Font</h4><div class="prow" id="fontRow"></div>
      <h4>Color</h4><div class="prow" id="colorRow"></div>
      <h4>Style</h4><div class="prow" id="styleRow"></div>

  </div>

  <div class="bezel" id="bezel">

    <div class="badge" id="recBadge">● REC</div>
    <div class="toast" id="toast"></div>

    <div class="pop" id="sfxPop" hidden>
      <h4>Sound FX: tap to play, they go into your clip</h4><div class="pads" id="pads"></div>

      </button><span class="lbl" id="recLbl">Record</span></div>
    <label class="ctl"><span class="circ"><span class="shape-i" id="shapeIcon" style="width:22px;height:22px"></span></span><span class="lbl">Ratio</span>
      <select id="shapeSel" aria-label="Shape"></select></label>

        <svg viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="#161616" stroke-width="6" stroke-linejoin="round">
          <rect x="22" y="42" width="56" height="36" rx="5" fill="#ffd23f"/>
          <path d="M22 42 L74 28 L78 40 Z" fill="#fff"/><path d="M36 38 L42 31 M52 34 L58 27" stroke-width="5"/>
          <path d="M44 52 L58 60 L44 68 Z" fill="#df3a4e" stroke-width="4"/>
        </svg></button><span class="lbl">Video</span></div>
  </div></nav>
</div>
<select id="nibbleSel" aria-label="Nibble" hidden>
        <option value="4075">Ghost #4075</option>

</div></div>
<video id="cam" playsinline muted style="display:none"></video>

<script type="module">
// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const MP_VERSION = '0.10.14';
const ART_V = '20261112-1405';   // bump when art changes, so phones never show old cached frames
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

// Each Nibble: eye layers e0–e4 and ten whole-face mouth frames m0–m9, all lined up at 1000×1000.
// Every mouth frame is the full picture with the jaw, cheeks and mouth redrawn for that sound.
// eyes: 0 as-drawn, 1 angry, 2 surprised, 3 half-closed, 4 closed
// mouths: 0 rest, 1 M B P, 2 slightly open, 3 wide "AH", 4 "EE" teeth, 5 "O", 6 "OO" pucker, 7 F V, 8 L, 9 frown
const NIBBLES = {
  4075: { bg:'#9de8ff', fullFace:true },
  // same face template as Grumble: his ten drawn mouths and blink, set on this ghost's face (his own open mouth at rest)
  1486: { bg:'#9de8ff', fullFace:true },
  4248: { bg:'#9de8ff', fullFace:true, trait:{ frames:6, fps:8 } },
  3133: { bg:'#ffb7dc', fullFace:true, trait:{ frames:50, fps:12.5, box:[254.5, 73.6, 364, 174.9], wobble:{ centre:[436.5, 156] } } },
  // another Wolf: his own ten mouths (two Gemini sheets) on his upper snout, eyes, hat and apron; blink eyes from a third sheet
  271: { bg:'#ffc186', fullFace:true },
  // his own ten mouths (two Gemini sheets) on his upper snout, halo, bruise and robe; blink from a third sheet
  7996: { bg:'#9de8ff', fullFace:true, trait:{ frames:1, fps:1, box:[271, 86, 332, 149], wobble:{ centre:[437, 160.5] } } },   // his halo floats on its own and bobs
  8549: { bg:'#ffb7dc', fullFace:true, trait:{ frames:20, fps:6.67 } },
  // his own ten mouths (two Gemini sheets) set into his wood-grain beard; blink drawn inside his glasses
  3385: { bg:'#ffb7dc', fullFace:true },
  // Cock: the fire in his eyes flickers behind his eyes and beak, so the eyes are always their own layer
  // and each mouth frame comes with its beak (+ mohawk) cut out to sit in front of the flames
  8212: { bg:'#ff8588', fullFace:true, trait:{ frames:6, fps:8, under:true }, eyesAlways:true, noBlink:true, overlay:true },
  // another Cock: same face layers as 8212 (his mouths and flames reused, recoloured to his feathers, with his own comb and hood)
  3154: { bg:'#89ebd2', fullFace:true, trait:{ frames:6, fps:8, under:true, from:8212 }, eyesAlways:true, noBlink:true, overlay:true },
};
const BONKD_BGS = { Meadow:'meadow', Woods:'woods', Mountain:'mountain', Canyon:'canyon', Desert:'desert', Harvest:'harvest', Cockfight:'cleeroy' };
// backdrops that hang a sign: it goes in open space the Nibble can never reach, and the text keeps clear of it too
const SIGNS = { Cockfight:'cleeroy_logo' };   // Cleeroy's Cockfight Club (Cleeroy owns Cock #8212)
// when the screen is tall enough, the club's own entrance art is used instead, cropped so its sign sits at the top
// (sign box as fractions of that picture); otherwise the stage with the sign hung over it
const ENTRANCE = { Cockfight:{ name:'cleeroy_ent', sign:[.058, .157, .941, .44] } };
const entCache = {};
function entrance() {
  const E = ENTRANCE[S.bg], A = READY[4075]; if (!E || !A || !A.bounds) return null;
  if (!entCache[E.name]) { const i = new Image(); i.src = `bg/${E.name}.webp?v=${ART_V}`; entCache[E.name] = i; }
  const img = entCache[E.name]; if (!(img.complete && img.naturalWidth)) return null;
  const W = stage.width, H = stage.height, m = Math.min(W, H), iw = img.naturalWidth, ih = img.naturalHeight;
  const sc = Math.max(W / iw, H / ih), tx = (W - iw * sc) / 2, ty = Math.max(H - ih * sc, -E.sign[1] * ih * sc);   // sign right at the top
  const sr = [tx + E.sign[0] * iw * sc, ty + E.sign[1] * ih * sc, tx + E.sign[2] * iw * sc, ty + E.sign[3] * ih * sc];
  // the club's exterior on every screen shape (user): in square and wide frames the Nibble stands in front of the sign
  const size = Math.min(W, H);
  return { img, sc, tx, ty, sr, size };
}
const MY_BG = {};   // backgrounds this person added: name -> picture (data URL), kept on this device
try { Object.assign(MY_BG, JSON.parse(localStorage.getItem('nf-bgs') || '{}')); } catch (e) {}
for (const k in MY_BG) BONKD_BGS[k] = 'mine';
const BACKGROUNDS = ['Nibble color', ...Object.keys(BONKD_BGS)];
const bgList = () => ['Nibble color', ...Object.keys(BONKD_BGS)];
const bgSrc = name => MY_BG[name] || `bg/${ENTRANCE[name] ? ENTRANCE[name].name : BONKD_BGS[name]}.webp?v=${ART_V}`;
const ASPECTS = { 'Square':[1080,1080], 'Vertical':[1080,1920], 'Wide':[1920,1080] };

const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_MOBILE = IS_IOS || /Android/i.test(UA);
// Wallet apps' built-in browsers crash when a page asks for the mic, so there we use the camera only.
const IN_WALLET = /Rainbow|MetaMask|CoinbaseWallet|Coinbase|Trust|imToken|TokenPocket|OKApp|Phantom/i.test(UA) || (IS_MOBILE && !!window.ethereum);

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const stage = $('stage'), ctx = stage.getContext('2d');
const video = $('cam');
const S = {
  id:null, art:null, trait:null, bg:'Nibble color',
  landmarker:null, tracking:false, lastVideoTime:-1,
  face:{ roll:0, yaw:0, pitch:0, seen:false, open:0, wide:0, round:0, smile:0, press:0, frown:0, fv:0, blink:0, brow:0, browUp:0 },
  calib:{ n:0, open:0, wide:0, pitch:0 },
  eye:{ cur:0, prev:0, t:0 }, mouth:{ cur:0, prev:0, t:0 },
  recorder:null, chunks:[], audioTracks:[],
};
window.__nibble = S; window.__voice = () => V;
let toastT = 0;
function setStatus(el, msg, kind='', ms=3200) {
  const t = $('toast'); clearTimeout(toastT);
  if (!msg) { t.style.display = 'none'; return t; }
  t.textContent = msg; t.className = 'toast ' + (kind === 'err' ? 'err' : ''); t.style.display = 'block';
  if (ms) toastT = setTimeout(() => { t.style.display = 'none'; }, ms);
  return t;
}
const loadImg = src => new Promise((res, rej) => { const i = new Image(); if (/^https?:/.test(src)) i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; });
// where a Nibble's pictures live: built in (faces/ID/), added by the community (Supabase), or being previewed (on this device)
function artURL(id, n) { const c = NIBBLES[id]; if (c && c.files) return c.files[n]; if (c && c.remote) return `${c.remote}${n}.${c.ext}`; return `faces/${id}/${n}.webp?v=${ART_V}`; }
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
for (const name of BACKGROUNDS) { const o = document.createElement('option'); o.value = o.textContent = name; $('bgSel').appendChild(o); }
const bgCache = {};
function bonkdBg(name) {
  if (!bgCache[name]) { const i = new Image(); i.src = MY_BG[name] || `bg/${BONKD_BGS[name]}.webp?v=${ART_V}`; bgCache[name] = i; }
  const i = bgCache[name]; return i.complete && i.naturalWidth ? i : null;
}
$('bgSel').onchange = e => { S.bg = e.target.value; if (BONKD_BGS[S.bg]) bonkdBg(S.bg); showSceneThumb(); };
const SHAPE_ICON = { 'Square':[22,22], 'Vertical':[17,28], 'Wide':[30,17] };
const RATIO_TXT = { 'Square':'Square (fills screen)', 'Vertical':'9:16 Vertical', 'Wide':'16:9 Wide' };
for (const name of Object.keys(ASPECTS)) { const o = document.createElement('option'); o.value = name; o.textContent = RATIO_TXT[name]; $('shapeSel').appendChild(o); }
function setShape(name) {
  S.shape = name; S.shapeN = (S.shapeN || 0) + 1; const [w, h] = ASPECTS[name]; stage.width = w; stage.height = h; $('shapeSel').value = name;
  const [iw, ih] = SHAPE_ICON[name]; const i = $('shapeIcon'); i.style.width = iw + 'px'; i.style.height = ih + 'px';
  fitStage();
}
$('shapeSel').onchange = e => {
  if (S.recorder) { e.target.value = S.shape || 'Square'; return; }
  setShape(e.target.value);
};
// The picture is fitted inside the screen as big as it can go without cropping.
function fitBox(aw, ah, r) { let w = aw, h = w / r; if (h > ah) { h = ah; w = h * r; } return [Math.floor(w), Math.floor(h)]; }
function screenSpace() {
  const b = $('bezel'), cs = getComputedStyle(b);
  return [b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), b.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)];
}
function fitStage() {
  const [aw, ah] = screenSpace(); if (aw <= 0 || ah <= 0) return;
  // Square: the Nibble's square sits at the bottom of the screen and the picture grows to fill the rest
  // (the backdrop continues and the text goes in the space above), so there's never any black around it.
  if (S.shape === 'Square' && !S.recorder && !(typeof VM !== 'undefined' && VM.rendering)) {
    // video encoders (Safari's especially) need even sizes: a 1080x1561 canvas records nothing, so round to a multiple of 8
    const r8 = v => Math.round(v / 8) * 8;
    const W = ah >= aw ? 1080 : r8(1080 * aw / ah), H = ah >= aw ? r8(1080 * ah / aw) : 1080;
    if (stage.width !== W || stage.height !== H) { stage.width = W; stage.height = H; }
  }
  const [w, h] = fitBox(aw, ah, stage.width / stage.height);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
}
new ResizeObserver(fitStage).observe($('bezel'));
addEventListener('resize', fitStage);
setShape('Square');
// Each control shows a picture of its current choice; the name sits underneath.
const FACE_AT = { 4075:[534,551,1.35], 1486:[600,560,1.35], 4248:[499,469,1.35], 3133:[560,494,1.35], 271:[560,494,1.35], 7996:[600,520,1.35], 8549:[507,533,1.35], 3385:[585,560,1.35], 8212:[496,520,1.35], 3154:[496,520,1.35] };   // face centre + zoom in the 1000px art
function showNibbleThumb(id) {
  const f = $('nibFace'), [cx, cy, zoom] = FACE_AT[id];               // show the face, centred
  const pos = c => (Math.min(1, Math.max(0, (c / 1000 * zoom - 0.5) / (zoom - 1))) * 100).toFixed(1) + '%';
  f.style.backgroundImage = `url(${artURL(id, 'base')})`; f.style.backgroundSize = (zoom * 100) + '%';
  f.style.backgroundPosition = `${pos(cx)} ${pos(cy)}`; f.style.backgroundColor = NIBBLES[id].bg;
  showSceneThumb();
}
function showSceneThumb() {
  const f = $('bgFace');
  f.style.backgroundImage = BONKD_BGS[S.bg] ? `url(${bgSrc(S.bg)})` : 'none';
  f.style.backgroundColor = S.bg === 'Nibble color' ? (S.id ? NIBBLES[S.id].bg : '#fff') : '#fff';
}
$('nibbleSel').onchange = e => { loadNibble(+e.target.value); showNibbleThumb(+e.target.value); };
// ---- pickers ----
const NIB_LIST = () => Array.from($('nibbleSel').options).map(o => { const [kind, num] = o.textContent.split(' #'); return { id:+o.value, kind, num }; });
function pkOpen(title, tiles, back) {
  $('pk').hidden = false; $('pkTitle').textContent = title; $('pkBack').hidden = !back; $('pkBack').onclick = back || null;
  const g = $('pkGrid'); g.innerHTML = '';
  for (const t of tiles) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pk-t' + (t.on ? ' on' : '');
    const im = document.createElement('span'); im.className = 'pk-img' + (t.plus ? ' pk-plus' : ''); t.paint(im);
    if (t.plus) im.textContent = '+';
    if (t.remove) { const x = document.createElement('span'); x.className = 'pk-rm'; x.textContent = '✕'; x.setAttribute('role', 'button'); x.setAttribute('aria-label', 'Remove ' + t.name);
      x.onclick = ev => { ev.stopPropagation(); t.remove(); }; im.appendChild(x); }
    if (t.count) { const c = document.createElement('span'); c.className = 'pk-c'; c.textContent = t.count; im.appendChild(c); }
    const n = document.createElement('span'); n.className = 'pk-n'; n.textContent = t.name;
    b.append(im, n); b.onclick = t.pick; g.appendChild(b);
  }
  g.scrollTop = 0;
}
function pkClose() { $('pk').hidden = true; }
$('pkX').onclick = pkClose;
$('pk').addEventListener('pointerdown', e => { if (e.target === $('pk')) pkClose(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('pk').hidden) pkClose(); });
// Nibbles: pick a kind (Wolf, Bear, Cock…), then a token
function pickNibble(cur, onPick) {
  const list = NIB_LIST(), kinds = [...new Set(list.map(n => n.kind))], curKind = (list.find(n => n.id === cur) || {}).kind;
  const kindsView = () => pkOpen('Choose a Nibble', [...kinds.map(k => { const ns = list.filter(n => n.kind === k);
    return { name:k, count:ns.length, on:k === curKind, paint:el => nibThumb(el, ns[0].id), pick:() => tokens(k) }; }),
    ...(onPick.noAdd ? [] : [{ name:'Add Nibble', plus:true, paint:() => {}, pick:() => { pkClose(); addNibble(); } }])]);
  const tokens = k => pkOpen(k === 'Wolf' ? 'Wolves' : k + 's', list.filter(n => n.kind === k).map(n => ({ name:'#' + n.num, on:n.id === cur, paint:el => nibThumb(el, n.id),
    pick:() => { pkClose(); onPick(n.id); },
    remove:ADMIN() && NIBBLES[n.id].remote ? () => adminRemove(n.id) : null })), kindsView);
  kindsView();
}
$('nibFace').onclick = () => pickNibble(S.id, id => { if (S.recorder) return; $('nibbleSel').value = id; loadNibble(id); showNibbleThumb(id); });
function bgThumb(el, name) {
  el.style.backgroundImage = BONKD_BGS[name] ? `url(${bgSrc(name)})` : 'none'; el.style.backgroundSize = 'cover'; el.style.backgroundPosition = 'center';
  el.style.backgroundColor = name === 'Nibble color' ? (S.id ? NIBBLES[S.id].bg : '#fff') : '#fff';
}
function pickBackground(cur, onPick) {
  pkOpen('Choose a background', [...bgList().map(name => ({ name, on:name === cur, paint:el => bgThumb(el, name), pick:() => { pkClose(); onPick(name); },
      remove:MY_BG[name] ? () => { delete MY_BG[name]; delete BONKD_BGS[name]; saveMyBgs(); if (S.bg === name) onPick('Nibble color'); pickBackground(S.bg, onPick); } : null })),
    { name:'Add background', plus:true, paint:() => {}, pick:() => addBackground(onPick) }]);
}
function saveMyBgs() { try { localStorage.setItem('nf-bgs', JSON.stringify(MY_BG)); return true; } catch (e) { return false; } }
// a picture from this device becomes a background: resized, kept here only
function addBackground(onPick) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try {
      const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
      const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      let n = 1; while (MY_BG['My background ' + n]) n++; const name = 'My background ' + n;
      MY_BG[name] = c.toDataURL('image/jpeg', 0.82); BONKD_BGS[name] = 'mine';
      if (!saveMyBgs()) setStatus('x', 'Added for now. This browser is out of room to keep it after you leave.', '', 5000);
      pkClose(); onPick(name);
    } catch (e) { setStatus('x', 'That picture wouldn\'t open. Try another one.', 'err'); }
  };
  inp.click();
}
$('bgFace').onclick = () => pickBackground(S.bg, name => { if (!$('bgSel').querySelector(`option[value="${CSS.escape(name)}"]`)) { const o = document.createElement('option'); o.value = o.textContent = name; $('bgSel').appendChild(o); } $('bgSel').value = name; S.bg = name; if (BONKD_BGS[S.bg]) bonkdBg(S.bg); showSceneThumb(); });

// ---------------------------------------------------------------------------
// Loading a Nibble (everything is bundled with the site)
// ---------------------------------------------------------------------------
const ART = {}, READY = {};   // every Nibble's art, loaded once
function fetchNibble(id) {
  if (ART[id]) return ART[id];
  const cfg = NIBBLES[id];
  return ART[id] = (async () => {
    const names = ['base', 'e0','e1','e2','e3','e4', 'm0','m1','m2','m3','m4','m5','m6','m7','m8','m9'];
    let imgs = await Promise.all(names.map(n => loadImg(artURL(id, n))));
    if (cfg.layout) {   // added Nibbles store only the changed boxes: put each mouth back on the base, each eye layer on a clear sheet
      const { mb, eb } = cfg.layout, mk = () => { const c = document.createElement('canvas'); c.width = c.height = 1000; return c; };
      imgs = imgs.map((im, k) => {
        if (k === 0) return im;
        const n = names[k], c = mk(), g = c.getContext('2d');
        if (n[0] === 'm') { g.drawImage(imgs[0], 0, 0, 1000, 1000); if (mb[2] > mb[0]) { g.clearRect(mb[0], mb[1], im.naturalWidth, im.naturalHeight); g.drawImage(im, mb[0], mb[1]); } }
        else if (n !== 'e0' && eb[2] > eb[0] && im.naturalWidth > 1) g.drawImage(im, eb[0], eb[1]);
        return c;

  const fill = () => { AN.traits = $('anTraits').value.trim(); const t = AN.traits || 'every trait exactly as in the original';
    for (const k of ['s1', 's2', 'eyes']) $('anP_' + k).textContent = PROMPTS[k](name, t); };
  fill(); $('anTraits').oninput = fill;
  vmBody().querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    const txt = $('anP_' + b.dataset.copy).textContent;
    try { await navigator.clipboard.writeText(txt); b.textContent = 'Copied!'; } catch (e) { const r = document.createRange(); r.selectNodeContents($('anP_' + b.dataset.copy)); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = 'Selected'; }
    setTimeout(() => b.textContent = 'Copy', 1500);
  });
  $('anBack').onclick = addNibble; $('anNext').onclick = addSheets;
}
function addSheets() {
  const slot = (k, label) => `<label class="an-up${AN[k] ? ' on' : ''}" id="anU_${k}"><span>${label}</span><b>${AN[k] ? '✓ Added' : 'Add picture'}</b><input type="file" accept="image/*" hidden data-k="${k}"></label>`;
  vmShow('Add the 3 pictures', `
    ${slot('f1', '1. Mouths (6 faces)')}${slot('f2', '2. More mouths (4 faces)')}${slot('f3', '3. Eyes (5 faces)')}
    <label class="an-chk"><input type="checkbox" id="anNoEyes"${AN.noEyes ? ' checked' : ''}> My Nibble's eyes don't blink (fire, X eyes…): skip picture 3</label>
    <button class="vm-go" id="anBuild" type="button">Build my Nibble</button>
    <button class="chipb seg" id="anBack" type="button">Back</button>`);
  vmBody().querySelectorAll('input[type=file]').forEach(inp => inp.onchange = () => { const f = inp.files && inp.files[0]; if (!f) return; AN[inp.dataset.k] = f; addSheets(); });
  $('anNoEyes').onchange = e => AN.noEyes = e.target.checked;
  $('anBack').onclick = addPrompts;
  $('anBuild').onclick = addBuild;
}
async function addBuild() {
  if (!AN.f1 || !AN.f2 || (!AN.f3 && !AN.noEyes)) { setStatus('x', 'Add all the pictures first.', 'err'); return; }
  vmShow('Building…', `<div class="vm-bar"><i id="vmProg" style="width:100%;animation:anPulse 1.2s ease-in-out infinite"></i></div><p class="note" id="anMsg">Getting started…</p>`);
  try {
    const B = await import('./builder.js?v=' + ART_V);
    const s1 = B.splitSheet(await B.loadImage(AN.f1), 3, 2), s2 = B.splitSheet(await B.loadImage(AN.f2), 4, 1);
    let eyes = null;
    if (!AN.noEyes && AN.f3) { const ei = await B.loadImage(AN.f3), n = B.countPanels(ei); eyes = B.splitSheet(ei, n >= 4 ? 5 : 3, 1); }
    const res = await B.build(AN.cut.canvas, { s1, s2, eyes }, t => { const m = $('anMsg'); if (m) m.textContent = t; });
    AN.res = res; AN.exp = await B.exportFiles(res, AN.cut.canvas);
    addResults();
  } catch (e) { vmShow('Something went wrong', `<p>The pictures couldn't be built (${esc(String(e && e.message || e))}). Check they're the right pictures and try again.</p><button class="vm-go" id="anBack" type="button">Back</button>`); $('anBack').onclick = addSheets; }
}
function addResults() {
  const r = AN.res, name = `${AN.kind} #${AN.token}`;
  const sheet = document.createElement('canvas'), cell = 150; sheet.width = cell * 5; sheet.height = cell * (r.eyes ? 3 : 2); sheet.width = cell * 5; const g = sheet.getContext('2d');
  const mb = r.mouthBox || [300, 300, 700, 700], cx = (mb[0] + mb[2]) / 2, cy = (mb[1] + mb[3]) / 2 - 40, half = Math.max(170, (mb[2] - mb[0]) * 0.75, (mb[3] - mb[1]) * 0.9), sx = Math.max(0, Math.min(1000 - 2 * half, cx - half)), sy = Math.max(0, Math.min(1000 - 2 * half, cy - half));
  const put = (layers, k) => { const x = (k % 5) * cell, y = Math.floor(k / 5) * cell; g.fillStyle = AN.cut.bg; g.fillRect(x, y, cell, cell);
    for (const l of layers) if (l) g.drawImage(l, sx, sy, 2 * half, 2 * half, x, y, cell, cell); };
  r.frames.forEach((f, k) => put([f], k));
  const ek = r.eyes ? [1, 2, 3, 4].filter(k => r.eyes[k]) : []; ek.forEach((k, i) => put([r.frames[0], r.eyes[k]], 10 + i));
  if (r.eyes) { g.fillStyle = '#fff'; g.fillRect((10 + ek.length) % 5 * cell, 2 * cell, (5 - ek.length) * cell, cell); }
  vmShow(r.ok ? `${name} is ready` : 'A few things to fix', `
    <div class="an-sheet" id="anSheet"></div>
    ${r.ok ? `<p class="note">Top two rows: the 10 mouths. ${r.eyes ? 'Bottom row: the eyes.' : ''} Look them over; if one looks wrong, go Back and change that picture.</p>` :
      `<ul class="an-prob">${r.problems.map(p => `<li>${esc(p)}</li>`).join('')}</ul>`}
    ${r.ok ? '<button class="vm-go" id="anTry" type="button" style="background:var(--paper);color:var(--ink)">Try it on camera</button><button class="vm-go" id="anPub" type="button">Add it to the filter</button>'
      : '<button class="vm-go" id="anRedo" type="button">Change the pictures</button>'}
    <button class="chipb seg" id="anBack" type="button">Back</button>`);
  $('anSheet').appendChild(sheet);
  $('anBack').onclick = addSheets;
  if (!r.ok) { $('anRedo').onclick = addSheets; return; }
  $('anTry').onclick = addTry; $('anPub').onclick = addPublish;
}
function previewFiles() {
  if (AN.urls) return AN.urls; AN.urls = {};
  for (const k in AN.exp.files) AN.urls[k] = URL.createObjectURL(AN.exp.files[k]);
  return AN.urls;
}
function addTry() {
  const id = AN.token;
  AN.prev = { had:NIBBLES[id], id:S.id };
  NIBBLES[id] = { bg:AN.cut.bg, fullFace:true, files:previewFiles(), layout:AN.exp.layout }; FACE_AT[id] = AN.exp.layout.at; delete ART[id];
  loadNibble(id); showNibbleThumb(id);
  $('vm').classList.add('rendering');
  vmShow(`Trying ${AN.kind} #${id}`, `<p class="note">Turn the camera on and talk. Happy with it?</p>
    <div class="vm-row"><button class="vm-go" id="anPub" type="button" style="margin:0">Add it to the filter</button></div>
    <button class="chipb seg" id="anBack" type="button">Back to the results</button>`);
  $('anPub').onclick = addPublish;
  $('anBack').onclick = () => { addUnpreview(); $('vm').classList.remove('rendering'); addResults(); };
}
function addUnpreview() {
  if (!AN.prev) return; const { had, id } = AN.prev; AN.prev = null;
  if (had) NIBBLES[AN.token] = had; else delete NIBBLES[AN.token]; delete ART[AN.token];
  if (S.id === AN.token) { $('nibbleSel').value = id; loadNibble(id); showNibbleThumb(id); }
}
async function addPublish() {
  $('vm').classList.remove('rendering');
  vmShow('Adding it…', `<div class="vm-bar"><i id="vmProg"></i></div><p class="note" id="anMsg">Uploading the pictures…</p>`);
  const id = AN.token, { files, ext, layout } = AN.exp, folder = `u/${id}-${Math.random().toString(36).slice(2, 10)}`, keys = Object.keys(files);
  try {
    let n = 0;
    for (const k of keys) {
      const r = await sbFetch(`/storage/v1/object/nibbles/${folder}/${k}.${ext}`, { method:'POST', headers:{ 'Content-Type':'image/' + ext, 'x-upsert':'false' }, body:files[k] });
      if (!r.ok) throw new Error('upload ' + r.status);
      $('vmProg').style.width = (100 * ++n / keys.length) + '%';
    }
    $('anMsg').textContent = 'Adding it to the filter…';
    const res = await sbRpc('nf_publish', { p_token:id, p_kind:AN.kind, p_bg:AN.cut.bg, p_face:layout, p_folder:folder, p_ext:ext, p_score:AN.res.score, p_key:ADMIN() || null });
    if (!res.ok) throw new Error(res.reason === 'taken' ? `${AN.kind} #${id} was just added by someone else.` : res.reason === 'built_in' ? `#${id} is already built into the filter.` : 'not saved (' + res.reason + ')');
    addUnpreview();
    registerCommunity({ token:id, kind:AN.kind, bg:AN.cut.bg, face:layout, folder, ext });
    $('nibbleSel').value = id; loadNibble(id); showNibbleThumb(id);
    vmShow(`${AN.kind} #${id} is in the filter!`, `<p>Everyone can pick ${esc(AN.kind)} #${id} now: tap Nibble, then ${esc(AN.kind)}.</p><button class="vm-go" id="anDone" type="button">Done</button>`);
    $('anDone').onclick = () => { vmHide(); for (const k in AN) delete AN[k]; };
  } catch (e) {
    vmShow('Couldn\'t add it', `<p>${esc(String(e.message || e))}. Check your connection and try again.</p><button class="vm-go" id="anRetry" type="button">Try again</button>`);
    $('anRetry').onclick = addPublish;
  }
}

function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return S['_' + k]; } }
function sessionStorageSet(k) { try { sessionStorage.setItem(k, '1'); } catch (e) { S['_' + k] = 1; } }
</script>
