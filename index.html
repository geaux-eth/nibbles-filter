<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NibbleME</title>
<style>
:root{
  --bg:#fff4e6; --panel:#ffffff; --ink:#1d1b20; --muted:#6b6470; --line:#1d1b20;
  --accent:#ff7a7a; --accent2:#8fd8ff; --me:#7b5cff; --ok:#3bb273;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:3px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:22px;letter-spacing:.3px}
header h1 span{color:var(--me)}
button,select{font:inherit;color:var(--ink)}
.btn{border:2.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .05s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent)}
.btn.rec{background:#ff4d4d;color:#fff}
.btn.small{padding:6px 12px;font-size:14px;border-radius:10px}
.btn.on{background:var(--accent2)}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr;padding:12px}}
.stage-wrap{position:relative;background:#222;border:3px solid var(--line);border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#stage{display:block;max-width:100%;max-height:78vh;width:auto;height:auto}
.badge{position:absolute;top:10px;right:10px;background:#ff4d4d;color:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;display:none}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;margin:0 0 6px;color:var(--muted)}
select{width:100%;border:2.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-weight:700;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--accent2)}
.status{font-size:13px;color:var(--muted);min-height:18px}
.status.err{color:#c0392b}
.status.ok{color:var(--ok)}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
#dl{display:none}
.toggle{display:flex;align-items:center;gap:10px;font-weight:800;cursor:pointer;user-select:none}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle i{position:relative;width:56px;height:32px;border:2.5px solid var(--line);border-radius:999px;background:#e8e3dc;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:#fff;border:2.5px solid var(--line);box-sizing:border-box;transition:transform .15s}
.toggle input:checked + i{background:var(--ok)}
.toggle input:checked + i::after{transform:translateX(24px)}
.toggle.busy{opacity:.6}
body.streaming header, body.streaming .panel, body.streaming .badge{display:none!important}
body.streaming main{display:block;padding:0;max-width:none}
body.streaming .stage-wrap{border:0;border-radius:0;height:100vh;background:#000}
body.streaming #stage{max-height:100vh;max-width:100vw}
#exitStream{position:fixed;bottom:12px;right:12px;display:none;opacity:.15}
body.streaming #exitStream{display:block}
#exitStream:hover{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Nibble<span>ME</span></h1>
  <label class="toggle" id="camToggle"><span>Camera</span><input type="checkbox" id="camSwitch"><i></i></label>
</header>

<main>
  <section>
    <div class="stage-wrap">
      <canvas id="stage" width="1080" height="1080"></canvas>
      <div class="badge" id="recBadge">● REC</div>
    </div>
    <video id="cam" playsinline muted style="display:none"></video>
    <div class="status" id="camStatus" style="margin-top:6px"></div>
  </section>

  <aside class="panel">
    <div>
      <h2>Nibble</h2>
      <select id="nibbleSel">
        <option value="4075">Ghost #4075</option>
        <option value="4248">Bear #4248</option>
        <option value="3133">Wolf #3133</option>
        <option value="8549">Gnome #8549</option>
      </select>
    </div>
    <div>
      <h2>Background</h2>
      <select id="bgSel"></select>
    </div>
    <div>
      <h2>Shape</h2>
      <div class="chips" id="aspects"></div>
    </div>
    <div>
      <h2>Go</h2>
      <div class="row">
        <button class="btn rec" id="recBtn">Record</button>
        <button class="btn" id="streamBtn">Stream mode</button>
      </div>
      <div class="status" id="recStatus"></div>
      <a id="dl" class="btn small" download>Save clip</a>
      <p class="hint">Stream mode hides everything but your Nibble and goes full screen, so OBS (or any streaming app) can capture it. With the Green screen background, add a Chroma Key filter in OBS to drop your Nibble over a game or video.</p>
    </div>
  </aside>
</main>
<button class="btn small" id="exitStream">Exit stream mode</button>

<script type="module">
// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const MP_VERSION = '0.10.14';
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

// Each Nibble: its cleaned art (base), drawn eyes e0–e4 and mouths m0–m6, all lined up at 1000×1000.
// eyes: 0 as-drawn, 1 angry, 2 surprised, 3 half-closed, 4 closed
// mouths: 0 as-drawn, 1 closed (M B P), 2 slightly open, 3 wide "AH", 4 grin "EE", 5 round "O", 6 pucker "OO"
const NIBBLES = {
  4075: { bg:'#9de8ff' },
  4248: { bg:'#9de8ff', trait:{ frames:6, fps:8 } },
  3133: { bg:'#ffb7dc', trait:{ frames:50, fps:12.5, box:[254.5, 73.6, 364, 174.9], wobble:{ centre:[436.5, 156] } } },
  8549: { bg:'#ffb7dc', trait:{ frames:20, fps:6.67 } },
};
const BONKD_BGS = { Meadow:'meadow', Woods:'woods', Mountain:'mountain', Canyon:'canyon', Desert:'desert', Harvest:'harvest' };
const BACKGROUNDS = ['Nibble color', ...Object.keys(BONKD_BGS), 'Green screen'];
const ASPECTS = { 'Square':[1080,1080], 'Vertical':[1080,1920], 'Wide':[1920,1080] };

const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_MOBILE = IS_IOS || /Android/i.test(UA);
// Wallet apps' built-in browsers crash when a page asks for the mic, so there we use the camera only.
const IN_WALLET = /Rainbow|MetaMask|CoinbaseWallet|Coinbase|Trust|imToken|TokenPocket|OKApp|Phantom/i.test(UA) || (IS_MOBILE && !!window.ethereum);

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const stage = $('stage'), ctx = stage.getContext('2d');
const video = $('cam');
const S = {
  id:null, art:null, trait:null, bg:'Nibble color',
  landmarker:null, tracking:false, lastVideoTime:-1,
  face:{ roll:0, yaw:0, pitch:0, seen:false, open:0, wide:0, round:0, smile:0, press:0, blink:0, brow:0, browUp:0 },
  calib:{ n:0, open:0, wide:0, pitch:0 },
  eye:{ cur:0, prev:0, t:0 }, mouth:{ cur:0, prev:0, t:0 },
  recorder:null, chunks:[], audioTracks:[],
};
window.__nibble = S;
function setStatus(el, msg, kind='') { const e = $(el); e.textContent = msg; e.className = 'status ' + kind; }
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
for (const name of BACKGROUNDS) { const o = document.createElement('option'); o.value = o.textContent = name; $('bgSel').appendChild(o); }
const bgCache = {};
function bonkdBg(name) {
  if (!bgCache[name]) { const i = new Image(); i.src = `bg/${BONKD_BGS[name]}.webp`; bgCache[name] = i; }
  const i = bgCache[name]; return i.complete && i.naturalWidth ? i : null;
}
$('bgSel').onchange = e => { S.bg = e.target.value; if (BONKD_BGS[S.bg]) bonkdBg(S.bg); };
for (const [name, [w, h]] of Object.entries(ASPECTS)) {
  const b = document.createElement('button');
  b.className = 'chip' + (w === h ? ' on' : ''); b.textContent = name;
  b.onclick = () => { if (S.recorder) return; stage.width = w; stage.height = h; [...$('aspects').children].forEach(c => c.classList.toggle('on', c === b)); };
  $('aspects').appendChild(b);
}
$('nibbleSel').onchange = e => loadNibble(+e.target.value);

// ---------------------------------------------------------------------------
// Loading a Nibble (everything is bundled with the site)
// ---------------------------------------------------------------------------
async function loadNibble(id) {
  S.id = id; S.art = null; S.trait = null;
  const cfg = NIBBLES[id];
  try {
    const names = ['base', 'e0','e1','e2','e3','e4', 'm0','m1','m2','m3','m4','m5','m6'];
    const imgs = await Promise.all(names.map(n => loadImg(`faces/${id}/${n}.webp`)));
    if (S.id !== id) return;
    S.art = { base:imgs[0], eyes:imgs.slice(1, 6), mouths:imgs.slice(6) };
    if (cfg.trait) {
      const t = cfg.trait;
      const frames = await Promise.all(Array.from({ length:t.frames }, (_, i) => loadImg(`traits/${id}/f${i}.webp`)));
      if (S.id === id) S.trait = { ...t, frames };
    }
  } catch (e) { setStatus('camStatus', 'Could not load that Nibble.', 'err'); }
}
loadNibble(4075);

// ---------------------------------------------------------------------------
// Camera + face tracking (MediaPipe Face Landmarker, on-device)
// ---------------------------------------------------------------------------
async function cameraOn() {
  $('camToggle').classList.add('busy');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:640}, height:{ideal:480} }, audio:false });
    video.srcObject = stream; await video.play();
    if (!S.landmarker) {
      setStatus('camStatus', 'Loading face tracker…');
      const vision = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/vision_bundle.mjs`);
      const files = await vision.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}/wasm`);
      const opts = { baseOptions:{ modelAssetPath:MP_MODEL, delegate: IN_WALLET ? 'CPU' : 'GPU' }, runningMode:'VIDEO', numFaces:1, outputFaceBlendshapes:true };
      try { S.landmarker = await vision.FaceLandmarker.createFromOptions(files, opts); }
      catch (e) { opts.baseOptions.delegate = 'CPU'; S.landmarker = await vision.FaceLandmarker.createFromOptions(files, opts); }
    }
    resetBaselines(); S.tracking = true;
    setStatus('camStatus', '');
  } catch (e) {
    $('camSwitch').checked = false;
    setStatus('camStatus', 'Camera blocked or unavailable. Allow camera access and try again.', 'err');
  }
  $('camToggle').classList.remove('busy');
}
function cameraOff() {
  S.tracking = false; S.face.seen = false;
  try { video.srcObject?.getTracks().forEach(t => t.stop()); } catch (e) {}
  video.srcObject = null;
}
$('camSwitch').onchange = e => e.target.checked ? cameraOn() : cameraOff();

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
// Every signal is judged against this person's own resting level, learned continuously from the last few seconds
// (a low percentile, so talking or blinking never raises the baseline).
const HIST = 150;
const H = {};
function resetBaselines() { for (const k of Object.keys(H)) delete H[k]; }
function base(name, v, pct=0.2) {
  const a = H[name] || (H[name] = []); a.push(v); if (a.length > HIST) a.shift();
  if (a.length < 12) return v;
  const s = [...a].sort((x, y) => x - y); return s[Math.floor((s.length - 1) * pct)];
}
function track(now) {
  if (!S.tracking || !S.landmarker || video.readyState < 2 || video.currentTime === S.lastVideoTime) return;
  S.lastVideoTime = video.currentTime;
  const r = S.landmarker.detectForVideo(video, now), f = S.face;
  if (!r.faceLandmarks || !r.faceLandmarks.length) { f.seen = false; return; }
  f.seen = true;
  const L = r.faceLandmarks[0];
  const bs = {}; (r.faceBlendshapes?.[0]?.categories || []).forEach(c => bs[c.categoryName] = c.score);
  const roll = -Math.atan2(L[263].y - L[33].y, L[263].x - L[33].x);
  const yaw = -(((L[1].x - L[234].x) / ((L[454].x - L[234].x) || 1e-6)) - 0.5) * 2;
  const eyeY = (L[33].y + L[263].y) / 2, mouthY = (L[13].y + L[14].y) / 2;
  const pr = (L[1].y - eyeY) / ((mouthY - eyeY) || 1e-6);
  const faceH = dist(L[10], L[152]) || 1e-6;
  const open = dist(L[13], L[14]) / faceH;                 // inner lip gap
  const wide = dist(L[78], L[308]) / faceH;                // corner to corner
  const blink = ((bs.eyeBlinkLeft || 0) + (bs.eyeBlinkRight || 0)) / 2;
  const brow = ((bs.browDownLeft || 0) + (bs.browDownRight || 0)) / 2;
  const browUp = bs.browInnerUp || 0;
  const round = Math.max(bs.mouthFunnel || 0, bs.mouthPucker || 0);
  const smile = ((bs.mouthSmileLeft || 0) + (bs.mouthSmileRight || 0)) / 2;
  const press = ((bs.mouthPressLeft || 0) + (bs.mouthPressRight || 0)) / 2 + (bs.mouthRollLower || 0) * .6;
  const rel = (v, b, span) => clamp((v - b) / span, 0, 1);
  const k = 0.6;
  f.open = lerp(f.open, rel(open, base('open', open, 0.1), 0.045), k);            // ~6% of face height = fully open
  f.wide = lerp(f.wide, clamp((wide - base('wide', wide, 0.5)) / 0.05, -1, 1), k);
  f.round = lerp(f.round, rel(round, base('round', round), 0.5), k);
  f.smile = lerp(f.smile, rel(smile, base('smile', smile), 0.5), k);
  f.press = lerp(f.press, rel(press, base('press', press), 0.45), k);
  const bb = base('blink', blink, 0.3);                                           // resting lids (e.g. looking down at the phone)
  f.blink = lerp(f.blink, rel(blink, bb, Math.max(0.25, 0.92 - bb)), .8);
  f.brow = lerp(f.brow, rel(brow, base('brow', brow, 0.3), 0.45), .5);
  f.browUp = lerp(f.browUp, rel(browUp, base('browUp', browUp, 0.3), 0.45), .5);
  f.roll = lerp(f.roll, roll, .5); f.yaw = lerp(f.yaw, clamp(yaw, -1, 1), .5);
  f.pitch = lerp(f.pitch, clamp((pr - base('pitch', pr, 0.5)) * 3, -1, 1), .4);
}

// Which drawn mouth / eyes match the face right now. Each state has to be clearly entered and clearly left
// (hysteresis), so the face doesn't flicker on the border between two shapes.
let openLvl = 0;   // 0 closed, 1 slightly open, 2 wide open
function pickMouth(f) {
  if (openLvl === 0 && f.open > 0.15) openLvl = 1;
  else if (openLvl === 1 && f.open > 0.62) openLvl = 2;
  else if (openLvl === 2 && f.open < 0.48) openLvl = 1;
  else if (openLvl === 1 && f.open < 0.07) openLvl = 0;
  const round = f.round > 0.45 || f.wide < -0.45, wideM = f.wide > 0.45 || f.smile > 0.55;
  if (openLvl === 2) return round ? 5 : 3;                       // O or AH
  if (openLvl === 1) return round ? 5 : wideM ? 4 : 2;           // O, EE or most speech
  if (round && f.round > 0.6) return 6;                          // OO / W
  if (f.press > 0.55) return 1;                                  // M B P
  if (f.smile > 0.7) return 4;
  return 0;
}
const eyeHold = { want:0, since:0 };
function pickEyes(f, now) {
  let want = 0;
  if (f.blink > 0.7) want = 4;
  else if (f.blink > 0.45) want = 3;
  else if (f.brow > 0.5) want = 1;
  else if (f.browUp > 0.55) want = 2;
  if (want !== eyeHold.want) { eyeHold.want = want; eyeHold.since = now; }
  const held = now - eyeHold.since;
  // blinks land right away; a squint, frown or raised brows has to be held a moment before the Nibble copies it
  if (want === 4) return 4;
  if (want === 3) return held > 260 ? 3 : (S.eye.cur === 4 ? 3 : 0);
  if (want === 1 || want === 2) return held > 220 ? want : S.eye.cur === want ? want : 0;
  return 0;
}
// Switch with a short cross-fade so changes blend instead of popping.
const FADE = { mouth:60, eye:50 };
function step(slot, want, now, minHold) {
  if (want !== slot.cur && now - slot.t > minHold) { slot.prev = slot.cur; slot.cur = want; slot.t = now; }
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function drawCover(img) {
  const W = stage.width, H = stage.height, sc = Math.max(W / img.width, H / img.height);
  ctx.drawImage(img, (W - img.width*sc)/2, (H - img.height*sc)/2, img.width*sc, img.height*sc);
}
function drawBackground() {
  const img = BONKD_BGS[S.bg] && bonkdBg(S.bg);
  if (img) { drawCover(img); return; }
  ctx.fillStyle = S.bg === 'Green screen' ? '#00ff00' : (S.id ? NIBBLES[S.id].bg : '#fff');
  ctx.fillRect(0, 0, stage.width, stage.height);
}
function drawLayer(list, slot, now, fade, x, y, size) {
  const t = clamp((now - slot.t) / fade, 0, 1);
  // the old frame stays solid underneath while the new one fades in on top (no see-through moment)
  if (t < 1 && slot.prev > 0) { ctx.globalAlpha = slot.cur > 0 ? 1 : 1 - t; ctx.drawImage(list[slot.prev], x, y, size, size); }
  if (slot.cur > 0) { ctx.globalAlpha = t; ctx.drawImage(list[slot.cur], x, y, size, size); }
  ctx.globalAlpha = 1;
}

// Spring wobble for floating traits: fast head moves kick it, it swings and settles.
const W8 = { a:0, va:0, x:0, vx:0, y:0, vy:0, pr:null, pyw:null, pp:null, t:0 };
function stepWobble(t, f) {
  const dt = Math.min(0.05, Math.max(0.001, (t - (W8.t || t - 16)) / 1000)); W8.t = t;
  if (f) {
    if (W8.pr !== null) { W8.va -= (f.roll - W8.pr) * 55; W8.vx -= (f.yaw - W8.pyw) * 2600; W8.vy -= (f.pitch - W8.pp) * 1400; }
    W8.pr = f.roll; W8.pyw = f.yaw; W8.pp = f.pitch;
  } else W8.pr = null;
  const k = 140, c = 7;
  W8.va += (-k * W8.a - c * W8.va) * dt; W8.a += W8.va * dt;
  W8.vx += (-k * W8.x - c * W8.vx) * dt; W8.x += W8.vx * dt;
  W8.vy += (-k * W8.y - c * W8.vy) * dt; W8.y += W8.vy * dt;
  W8.a = clamp(W8.a, -.45, .45); W8.x = clamp(W8.x, -70, 70); W8.y = clamp(W8.y, -40, 40);
}
function drawTrait(t, x, y, size, f) {
  const tr = S.trait; if (!tr) return;
  const img = tr.frames[Math.floor(t / (1000 / tr.fps)) % tr.frames.length], k = size / 1000;
  const [bx, by, bw, bh] = tr.box || [0, 0, 1000, 1000];
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  if (tr.wobble) { stepWobble(t, f); const [cx, cy] = tr.wobble.centre; ctx.translate(cx + W8.x, cy + W8.y); ctx.rotate(W8.a); ctx.translate(-cx, -cy); }
  ctx.drawImage(img, bx, by, bw, bh);
  ctx.restore();
}

function drawNibble(t) {
  const A = S.art; if (!A) return;
  const W = stage.width, H = stage.height, size = Math.min(W, H);
  const f = S.face, live = S.tracking && f.seen;
  const roll = live ? f.roll : Math.sin(t/1400) * 0.03;
  const yaw = live ? f.yaw : 0, pitch = live ? f.pitch : 0;
  const breathe = Math.sin(t/650) * 0.006;
  if (live) {
    step(S.mouth, pickMouth(f), t, 55);
    const e = pickEyes(f, t);
    // a blink never jumps straight from open to shut: it passes through half-closed
    if (e === 4 && S.eye.cur !== 4 && S.eye.cur !== 3) step(S.eye, 3, t, 0);
    else if (e === 0 && S.eye.cur === 4) step(S.eye, 3, t, 40);
    else step(S.eye, e, t, e === 4 || S.eye.cur === 3 ? 35 : 90);
  } else {
    step(S.mouth, 0, t, 0);
    // idle blink every few seconds
    const ph = (t % 4200);
    step(S.eye, ph < 70 ? 3 : ph < 170 ? 4 : ph < 240 ? 3 : 0, t, 0);
  }
  const px = W/2, py = H;
  ctx.save();
  ctx.translate(px + yaw * size * 0.03, py + pitch * size * 0.015);
  ctx.rotate(clamp(roll, -.4, .4) * 0.35);
  ctx.scale(1 - Math.abs(yaw) * 0.04, 1 + breathe);
  ctx.translate(-px, -py);
  const x = (W - size)/2, y = H - size;
  ctx.drawImage(A.base, x, y, size, size);
  ctx.drawImage(A.base, 0, 997, 1000, 3, x, H - 1, size, size * 0.3);   // body continues below the frame edge
  drawLayer(A.eyes, S.eye, t, FADE.eye, x, y, size);
  drawLayer(A.mouths, S.mouth, t, FADE.mouth, x, y, size);
  drawTrait(t, x, y, size, live ? f : null);
  ctx.restore();
}

function frame(now) {
  track(now);
  drawBackground();
  drawNibble(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------------------
// Recording (mic only outside wallet browsers, asked for only when recording)
// ---------------------------------------------------------------------------
async function getMic() {
  if (IN_WALLET) return [];
  if (S.audioTracks.length && S.audioTracks[0].readyState === 'live') return S.audioTracks;
  try { const m = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true }, video:false }); S.audioTracks = m.getAudioTracks(); }
  catch (e) { S.audioTracks = []; }
  return S.audioTracks;
}
$('recBtn').onclick = async () => {
  if (S.recorder) { try { S.recorder.stop(); } catch (e) {} return; }
  if (!stage.captureStream || !window.MediaRecorder) { setStatus('recStatus', 'This browser can\'t record. Try Safari or Chrome.', 'err'); return; }
  try {
    const out = stage.captureStream(30);
    (await getMic()).forEach(tr => { if (tr.readyState === 'live') out.addTrack(tr); });
    const mimeType = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    S.chunks = [];
    S.recorder = new MediaRecorder(out, mimeType ? { mimeType, videoBitsPerSecond:3_000_000 } : undefined);
    S.recorder.ondataavailable = e => e.data && e.data.size && S.chunks.push(e.data);
    S.recorder.onerror = () => { S.recorder = null; $('recBtn').textContent = 'Record'; $('recBadge').style.display = 'none'; setStatus('recStatus', 'Recording stopped unexpectedly.', 'err'); };
    S.recorder.onstop = () => {
      const type = (S.recorder && S.recorder.mimeType) || mimeType || 'video/webm';
      const blob = new Blob(S.chunks, { type });
      const name = `nibbleme-${S.id}-${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
      const dl = $('dl'); dl.href = URL.createObjectURL(blob); dl.download = name; dl.style.display = 'inline-block';
      S.recorder = null; $('recBtn').textContent = 'Record'; $('recBadge').style.display = 'none';
      setStatus('recStatus', 'Clip ready.', 'ok');
      let file = null; try { file = new File([blob], name, { type }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
        dl.onclick = async ev => { ev.preventDefault(); try { await navigator.share({ files:[file] }); } catch (e) {} };
      } else dl.onclick = null;
    };
    S.recorder.start(1000);
    $('recBtn').textContent = 'Stop'; $('recBadge').style.display = 'block'; $('dl').style.display = 'none';
    setStatus('recStatus', S.audioTracks.length ? 'Recording…' : IN_WALLET ? 'Recording without sound (wallet browsers block the mic — open in Safari for sound).' : 'Recording (no mic access, so no sound)…');
  } catch (e) { S.recorder = null; setStatus('recStatus', 'Recording isn\'t supported in this browser. Try Safari or Chrome.', 'err'); }
};

// ---------------------------------------------------------------------------
// Stream mode: only the Nibble, full screen, for OBS window capture
// ---------------------------------------------------------------------------
$('streamBtn').onclick = async () => { document.body.classList.add('streaming'); try { await document.documentElement.requestFullscreen?.(); } catch (e) {} };
function exitStream() { document.body.classList.remove('streaming'); if (document.fullscreenElement) document.exitFullscreen(); }
$('exitStream').onclick = exitStream;
document.addEventListener('keydown', e => { if (e.key === 'Escape') exitStream(); });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('streaming'); });
</script>
