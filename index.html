<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#ffd23f">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nibble FILTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Luckiest+Guy&family=Bangers&family=Permanent+Marker&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#ffd23f; --paper:#ffffff; --ink:#161616; --line:#161616;
  --gold:#ffd23f; --red:#df3a4e; --green:#8ee26b; --sky:#9fe3fb; --cream:#fff3c4; --pink:#f48aa8; --ok:#8ee26b;
  --display:'Lilita One','Arial Black',Impact,sans-serif; --body:'Baloo 2',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;color:var(--ink);font:600 15px/1.4 var(--body);
  background:var(--page)}
button,select,input{font:inherit;color:var(--ink)}

/* The whole app is one cartoon gadget: a white Bonkd card with an ink outline and a dark screen */
.device{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;
  width:calc(100% - 24px);max-width:640px;margin:max(10px,env(safe-area-inset-top)) auto max(12px,env(safe-area-inset-bottom));
  padding:12px var(--pad) 17px;background:var(--paper);border:3px solid var(--ink);border-radius:30px;box-shadow:5px 6px 0 var(--ink)}

header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 0 12px}
header .brand{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
header h1{margin:0;font:400 30px/1 var(--display);letter-spacing:.02em;display:flex;align-items:center;gap:6px;white-space:nowrap;
  color:var(--gold);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
header h1 span{font-size:15px;letter-spacing:.06em;color:#fff;-webkit-text-stroke:0;text-shadow:none;background:var(--red);border:2.5px solid var(--ink);
  border-radius:8px;padding:4px 7px 1px;box-shadow:2px 2px 0 var(--ink);transform:rotate(-6deg);display:inline-block;line-height:1}
header .credit{font:400 10px/1 var(--display);letter-spacing:.14em;color:var(--ink);opacity:.5;margin-left:2px}
header .credit b{font-weight:400}

.toggle{flex:none;display:flex;align-items:center;gap:8px;font:400 15px/1 var(--display);letter-spacing:.04em;cursor:pointer;user-select:none;-webkit-user-select:none;
  background:var(--paper);border:2.5px solid var(--line);border-radius:999px;padding:4px 5px 4px 12px;box-shadow:2px 2px 0 var(--line)}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle i{position:relative;width:52px;height:30px;border:2.5px solid var(--line);border-radius:999px;background:#e8e3dc;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:1.5px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2.5px solid var(--line);box-sizing:border-box;transition:transform .15s}
.toggle input:checked + i{background:var(--gold)}
.toggle input:checked + i::after{transform:translateX(22px)}
.toggle input:focus-visible + i{outline:3px dashed var(--ink);outline-offset:2px}
.toggle.busy{opacity:.6}
/* both switches: red pill while off; on, the pill turns green and the track inside turns gold */
#camToggle,#txtToggle{background:var(--red);color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;transition:background .15s}
#camToggle.on,#txtToggle.on{background:var(--green)}
/* Safari paints a rounded box's fill square for a moment while it animates; keep every fill inside its outline */
.toggle,.aa,#txtIn,.pop,.chipb,.sw,.badge,.toast,#exitStream,.bezel,.device,.circ{background-clip:padding-box;isolation:isolate}
.toggle,.aa,.chipb{overflow:hidden}

/* the screen: ink bezel, the picture fitted inside it, a cartoon glint on the glass */
.bezel{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:7px;background:var(--ink);border-radius:22px}
#stage{display:block;width:0;height:0;border-radius:15px;background:#222;touch-action:none}
.glare{position:absolute;top:12px;left:12px;width:30px;height:30px;pointer-events:none;opacity:.8}
.badge{position:absolute;top:14px;right:14px;background:var(--red);color:#fff;border:2px solid var(--line);border-radius:8px;padding:4px 8px 1px;
  font:400 13px/1 var(--display);letter-spacing:.06em;box-shadow:2px 2px 0 var(--line);transform:rotate(4deg);display:none}
.toast{white-space:normal;position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:88%;background:#fff;border:2.5px solid var(--line);border-radius:14px;
  padding:8px 12px;font-size:13px;font-weight:700;text-align:center;box-shadow:3px 3px 0 var(--line);display:none;z-index:5}
.toast.err{background:#ffe1dc}
.toast .save{display:inline-block;white-space:nowrap;background:var(--red);color:#fff;text-decoration:none;border:2.5px solid var(--line);border-radius:999px;padding:7px 16px 4px;
  font:400 16px/1 var(--display);letter-spacing:.04em;vertical-align:middle;box-shadow:2px 2px 0 var(--line)}
.toast .close{display:inline-block;white-space:nowrap;color:var(--ink);text-decoration:none;font-size:18px;padding:4px 4px 4px 12px;vertical-align:middle}

/* text bar: a switch, a chat-style box (Enter puts it on screen), and the Aa style card.
   It sits above the screen so the phone keyboard never has to push the page up to reach it. */
.textbar{position:relative;flex:none;display:flex;align-items:center;gap:8px}
.textbar .toggle{padding:4px 4px 4px 10px;gap:6px;font-size:14px}
.textbar .toggle i{width:44px;height:26px}
.textbar .toggle i::after{width:18px;height:18px}
.textbar .toggle input:checked + i::after{transform:translateX(18px)}
.txt-form{flex:1;min-width:0;display:flex}
#txtIn{flex:1;min-width:0;height:40px;padding:3px 12px 0;font:600 16px/1 var(--body);border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:2px 2px 0 var(--ink);outline:none}
#txtIn:focus{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink),0 0 0 3px var(--gold)}
#txtIn::placeholder{color:#8f887c}
#txtIn:disabled{background:#f3eee4;box-shadow:none;opacity:1}
.aa{flex:none;width:40px;height:40px;padding:2px 0 0;border:2.5px solid var(--ink);border-radius:12px;background:var(--gold);font:400 18px/1 var(--display);letter-spacing:.02em;
  box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.aa:active,.aa.on{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.pop{position:absolute;left:0;right:0;top:calc(100% + 12px);z-index:10;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);
  padding:10px 14px 14px;display:grid;gap:4px}
.pop[hidden]{display:none}
.pop h4{margin:4px 0 2px;font:400 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (max-width:400px){ .pop{padding:8px 10px 12px} .chipb{font-size:15px;padding:6px 9px 4px} .chipb.seg{font-size:13px;padding:6px 9px 4px} .sw{width:26px;height:26px} .prow .sep{margin:0 1px} }
.chipb{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:6px 11px 4px;font-size:16px;line-height:1;cursor:pointer}
.chipb.on{background:var(--gold);box-shadow:2px 2px 0 var(--ink)}
.chipb.seg{font:400 14px/1 var(--display);letter-spacing:.04em;padding:7px 12px 5px}
.sw{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);padding:0;cursor:pointer}
.sw.on{box-shadow:0 0 0 2.5px var(--paper),0 0 0 5px var(--ink)}
.prow .sep{width:2px;height:22px;background:var(--ink);opacity:.2;margin:0 4px}

/* control dock: the bottom panel of the gadget, under a ruled line */
.bar{flex:none;margin:0 calc(-1 * var(--pad));padding:10px 8px 0;border-top:2.5px solid var(--ink)}
.dock{display:grid;grid-template-columns:1fr 1.32fr 1.12fr 1fr 1fr;align-items:end;max-width:460px;margin:0 auto}
.ctl{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.circ{display:block;flex:none;width:50px;height:50px;margin:5px 0 0;border-radius:50%;border:2.5px solid var(--line);background:#fff center/cover no-repeat;
  position:relative;padding:0;-webkit-appearance:none;appearance:none;cursor:pointer;overflow:hidden;box-shadow:2px 2px 0 var(--line);transition:transform .06s}
.ctl:active .circ{transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
.circ svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.lbl{display:block;max-width:100%;font:400 11.5px/1.15 var(--display);letter-spacing:.04em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px;-webkit-appearance:none;appearance:none}
.ctl.rec-c .circ{width:60px;height:60px;margin:0;border-width:3px;background:#fff;box-shadow:3px 3px 0 var(--line)}
.rec-dot{fill:var(--red)}
.rec-sq{fill:var(--red);display:none}
#recBtn.on .rec-dot{display:none}
#recBtn.on .rec-sq{display:inline}
#recBtn.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:3px 3px 0 var(--line),0 0 0 6px rgba(223,58,78,.25)}}
.shape-i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2.5px solid var(--line);border-radius:4px;background:var(--gold)}

@media (max-width:400px){
  .device{width:calc(100% - 18px);--pad:11px;padding-top:11px;border-radius:26px;box-shadow:4px 5px 0 var(--ink)}
  header{padding:0 10px 0 9px;gap:6px} header h1{font-size:25px;gap:5px} header h1 span{font-size:12.5px;padding:3px 6px 1px}
  .toggle{gap:6px;padding:3px 4px 3px 9px;font-size:14px} .toggle i{width:46px;height:27px} .toggle i::after{width:19px;height:19px} .toggle input:checked + i::after{transform:translateX(19px)}
}
@media (max-width:350px){
  header h1{font-size:22px} header h1 span{font-size:11px} header .credit{font-size:9px}
  .toggle{font-size:13px} .textbar .toggle{font-size:13px;padding-left:8px}
  .pop{padding:8px 8px 12px} .prow{gap:5px} .sw{width:24px;height:24px} .chipb.seg{padding:6px 8px 4px} .circ{width:44px;height:44px} .ctl.rec-c .circ{width:54px;height:54px} .lbl{font-size:10px} .bar{padding:8px 4px 0}
}

/* stream mode: only the picture, full screen */
body.streaming{background:#000}
body.streaming .device{margin:0;width:100%;max-width:none;border:0;border-radius:0;box-shadow:none;padding:0;background:#000}
body.streaming header,body.streaming .textbar,body.streaming .bar,body.streaming .glare,body.streaming .badge,body.streaming .toast{display:none!important}
body.streaming .bezel{padding:0;border-radius:0;background:#000}
body.streaming #stage{border-radius:0}
#exitStream{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;display:none;z-index:20;background:#fff;border:2.5px solid var(--line);border-radius:999px;padding:10px 16px 7px;font:400 16px/1 var(--display);letter-spacing:.04em;box-shadow:3px 3px 0 var(--line);transition:opacity .4s}
body.streaming #exitStream{display:block}
#exitStream.dim{opacity:.35}
</style>
</head>
<body>
<div class="device">
  <header>
    <div class="brand"><h1>NIBBLE<span>FILTER</span></h1><div class="credit">BUILT by <b>GEAUX</b></div></div>
    <label class="toggle" id="camToggle"><span>Camera</span><input type="checkbox" id="camSwitch"><i></i></label>
  </header>

  <div class="textbar">
    <label class="toggle" id="txtToggle"><span>Text</span><input type="checkbox" id="txtSwitch"><i></i></label>
    <form class="txt-form" id="txtForm" autocomplete="off"><input id="txtIn" type="text" maxlength="80" enterkeyhint="send" placeholder="Text is off" disabled aria-label="On-screen text"></form>
    <button class="aa" id="aaBtn" type="button" aria-label="Text style" aria-expanded="false">Aa</button>
    <div class="pop" id="pop" hidden>
      <h4>Font</h4><div class="prow" id="fontRow"></div>
      <h4>Color</h4><div class="prow" id="colorRow"></div>
      <h4>Style</h4><div class="prow" id="styleRow"></div>
    </div>
  </div>

  <div class="bezel" id="bezel">
    <canvas id="stage" width="1080" height="1080"></canvas>
    <svg class="glare" viewBox="0 0 30 30" aria-hidden="true" fill="none" stroke="#fff" stroke-linecap="round"><path d="M4 19 Q4 4 19 4" stroke-width="4"/><path d="M4 26.5 L4 26.6" stroke-width="4"/></svg>
    <div class="badge" id="recBadge">● REC</div>
    <div class="toast" id="toast"></div>
  </div>

  <nav class="bar"><div class="dock">
    <label class="ctl"><span class="circ" id="nibFace"></span><span class="lbl">Nibble</span>
      <select id="nibbleSel" aria-label="Nibble">
        <option value="4075">Ghost #4075</option>
        <option value="4248">Bear #4248</option>
        <option value="3133">Wolf #3133</option>
        <option value="8549">Gnome #8549</option>
        <option value="8212">Cock #8212</option>
      </select></label>
    <label class="ctl"><span class="circ" id="bgFace"></span><span class="lbl">Background</span>
      <select id="bgSel" aria-label="Background"></select></label>
    <div class="ctl rec-c"><button class="circ" id="recBtn" aria-label="Record">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rec-dot" cx="50" cy="50" r="34"/><rect class="rec-sq" x="31" y="31" width="38" height="38" rx="8"/></svg>
      </button><span class="lbl" id="recLbl">Record</span></div>
    <label class="ctl"><span class="circ"><span class="shape-i" id="shapeIcon" style="width:22px;height:22px"></span></span><span class="lbl">Ratio</span>
      <select id="shapeSel" aria-label="Shape"></select></label>
    <div class="ctl"><button class="circ" id="streamBtn" aria-label="Stream mode">
        <svg viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="#161616" stroke-width="7" stroke-linecap="round">
          <circle cx="50" cy="50" r="8" fill="#df3a4e" stroke="none"/>
          <path d="M35 35 a21 21 0 0 0 0 30"/><path d="M65 35 a21 21 0 0 1 0 30"/>
          <path d="M24 24 a37 37 0 0 0 0 52"/><path d="M76 24 a37 37 0 0 1 0 52"/>
        </svg></button><span class="lbl">Stream</span></div>
  </div></nav>
</div>
<button id="exitStream">✕ Exit stream</button>
<video id="cam" playsinline muted style="display:none"></video>

<script type="module">
// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const MP_VERSION = '0.10.14';
const ART_V = '20261030-1552';   // bump when art changes, so phones never show old cached frames
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

// Each Nibble: eye layers e0–e4 and ten whole-face mouth frames m0–m9, all lined up at 1000×1000.
// Every mouth frame is the full picture with the jaw, cheeks and mouth redrawn for that sound.
// eyes: 0 as-drawn, 1 angry, 2 surprised, 3 half-closed, 4 closed
// mouths: 0 rest, 1 M B P, 2 slightly open, 3 wide "AH", 4 "EE" teeth, 5 "O", 6 "OO" pucker, 7 F V, 8 L, 9 frown
const NIBBLES = {
  4075: { bg:'#9de8ff', fullFace:true },
  4248: { bg:'#9de8ff', fullFace:true, trait:{ frames:6, fps:8 } },
  3133: { bg:'#ffb7dc', fullFace:true, trait:{ frames:50, fps:12.5, box:[254.5, 73.6, 364, 174.9], wobble:{ centre:[436.5, 156] } } },
  8549: { bg:'#ffb7dc', fullFace:true, trait:{ frames:20, fps:6.67 } },
  // Cock: the fire in his eyes flickers behind his eyes and beak, so the eyes are always their own layer
  // and each mouth frame comes with its beak (+ mohawk) cut out to sit in front of the flames
  8212: { bg:'#ff8588', fullFace:true, trait:{ frames:6, fps:8, under:true }, eyesAlways:true, noBlink:true, overlay:true },
};
const BONKD_BGS = { Meadow:'meadow', Woods:'woods', Mountain:'mountain', Canyon:'canyon', Desert:'desert', Harvest:'harvest' };
const BACKGROUNDS = ['Nibble color', ...Object.keys(BONKD_BGS), 'Green screen'];
const ASPECTS = { 'Square':[1080,1080], 'Vertical':[1080,1920], 'Wide':[1920,1080] };

const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_MOBILE = IS_IOS || /Android/i.test(UA);
// Wallet apps' built-in browsers crash when a page asks for the mic, so there we use the camera only.
const IN_WALLET = /Rainbow|MetaMask|CoinbaseWallet|Coinbase|Trust|imToken|TokenPocket|OKApp|Phantom/i.test(UA) || (IS_MOBILE && !!window.ethereum);

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const stage = $('stage'), ctx = stage.getContext('2d');
const video = $('cam');
const S = {
  id:null, art:null, trait:null, bg:'Nibble color',
  landmarker:null, tracking:false, lastVideoTime:-1,
  face:{ roll:0, yaw:0, pitch:0, seen:false, open:0, wide:0, round:0, smile:0, press:0, frown:0, fv:0, blink:0, brow:0, browUp:0 },
  calib:{ n:0, open:0, wide:0, pitch:0 },
  eye:{ cur:0, prev:0, t:0 }, mouth:{ cur:0, prev:0, t:0 },
  recorder:null, chunks:[], audioTracks:[],
};
window.__nibble = S; window.__voice = () => V;
let toastT = 0;
function setStatus(el, msg, kind='', ms=3200) {
  const t = $('toast'); clearTimeout(toastT);
  if (!msg) { t.style.display = 'none'; return t; }
  t.textContent = msg; t.className = 'toast ' + (kind === 'err' ? 'err' : ''); t.style.display = 'block';
  if (ms) toastT = setTimeout(() => { t.style.display = 'none'; }, ms);
  return t;
}
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
for (const name of BACKGROUNDS) { const o = document.createElement('option'); o.value = o.textContent = name; $('bgSel').appendChild(o); }
const bgCache = {};
function bonkdBg(name) {
  if (!bgCache[name]) { const i = new Image(); i.src = `bg/${BONKD_BGS[name]}.webp?v=${ART_V}`; bgCache[name] = i; }
  const i = bgCache[name]; return i.complete && i.naturalWidth ? i : null;
}
$('bgSel').onchange = e => { S.bg = e.target.value; if (BONKD_BGS[S.bg]) bonkdBg(S.bg); showSceneThumb(); };
const SHAPE_ICON = { 'Square':[22,22], 'Vertical':[17,28], 'Wide':[30,17] };
const RATIO_TXT = { 'Square':'Square (fills screen)', 'Vertical':'9:16 Vertical', 'Wide':'16:9 Wide' };
for (const name of Object.keys(ASPECTS)) { const o = document.createElement('option'); o.value = name; o.textContent = RATIO_TXT[name]; $('shapeSel').appendChild(o); }
function setShape(name) {
  S.shape = name; S.shapeN = (S.shapeN || 0) + 1; const [w, h] = ASPECTS[name]; stage.width = w; stage.height = h; $('shapeSel').value = name;
  const [iw, ih] = SHAPE_ICON[name]; const i = $('shapeIcon'); i.style.width = iw + 'px'; i.style.height = ih + 'px';
  fitStage();
}
$('shapeSel').onchange = e => {
  if (S.recorder) { e.target.value = S.shape || 'Square'; return; }
  setShape(e.target.value);
};
// The picture is fitted inside the screen as big as it can go without cropping.
function fitBox(aw, ah, r) { let w = aw, h = w / r; if (h > ah) { h = ah; w = h * r; } return [Math.floor(w), Math.floor(h)]; }
function screenSpace() {
  const b = $('bezel'), cs = getComputedStyle(b);
  return [b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), b.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)];
}
function fitStage() {
  const [aw, ah] = screenSpace(); if (aw <= 0 || ah <= 0) return;
  // Square: the Nibble's square sits at the bottom of the screen and the picture grows to fill the rest
  // (the backdrop continues and the text goes in the space above), so there's never any black around it.
  if (S.shape === 'Square' && !S.recorder) {
    const W = ah >= aw ? 1080 : Math.round(1080 * aw / ah), H = ah >= aw ? Math.round(1080 * ah / aw) : 1080;
    if (stage.width !== W || stage.height !== H) { stage.width = W; stage.height = H; }
  }
  const [w, h] = fitBox(aw, ah, stage.width / stage.height);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
}
new ResizeObserver(fitStage).observe($('bezel'));
addEventListener('resize', fitStage);
setShape('Square');
// Each control shows a picture of its current choice; the name sits underneath.
const FACE_AT = { 4075:[600,560,1.25], 4248:[560,500,1.2], 3133:[600,520,1.15], 8549:[570,520,1.25], 8212:[560,500,1.2] };   // face centre + zoom in the 1000px art
function showNibbleThumb(id) {
  const f = $('nibFace'), [cx, cy, zoom] = FACE_AT[id];               // show the face, centred
  const pos = c => (Math.min(1, Math.max(0, (c / 1000 * zoom - 0.5) / (zoom - 1))) * 100).toFixed(1) + '%';
  f.style.backgroundImage = `url(faces/${id}/base.webp?v=${ART_V})`; f.style.backgroundSize = (zoom * 100) + '%';
  f.style.backgroundPosition = `${pos(cx)} ${pos(cy)}`; f.style.backgroundColor = NIBBLES[id].bg;
  showSceneThumb();
}
function showSceneThumb() {
  const f = $('bgFace');
  f.style.backgroundImage = BONKD_BGS[S.bg] ? `url(bg/${BONKD_BGS[S.bg]}.webp?v=${ART_V})` : 'none';

  if (A.edgeR) { ctx.drawImage(A.base, 998, 0, 2, 1000, x + size - 1, y, size*0.5, size); ctx.drawImage(A.base, 998, 997, 2, 3, x + size - 1, H - 1, size*0.5, size*0.3); }

  const cfg = NIBBLES[S.id], under = S.trait && S.trait.under;
  if (under) drawTrait(t, x, y, size, live ? f : null);
  if (cfg.eyesAlways) ctx.drawImage(A.eyes[cfg.noBlink ? 0 : S.eye.cur], x, y, size, size);   // eyes made of fire don't blink
  else drawLayer(A.eyes, S.eye, t, FADE.eye, x, y, size);
  if (A.over) ctx.drawImage(A.over[S.mouth.cur], x, y, size, size);
  if (!under) drawTrait(t, x, y, size, live ? f : null);
  ctx.restore();
}

// Debug readout (only with ?debug in the address): draws what the tracker reads into the picture,
// so a recorded clip shows exactly why the Nibble did what it did. Nothing is sent anywhere.
const DEBUG = new URLSearchParams(location.search).has('debug');
function drawDebug() {
  if (!DEBUG) return;
  const f = S.face, rows = [['open',f.open],['wide',(f.wide+1)/2],['round',f.round],['smile',f.smile],['press',f.press],['blink',f.blink],['frown',f.brow],['brows up',f.browUp]];
  const k = Math.min(stage.width, stage.height) / 1080, x = 16*k, y = 16*k, w = 300*k, rh = 30*k;
  ctx.save(); ctx.globalAlpha = .82; ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, rh*(rows.length+1.4)); ctx.globalAlpha = 1;
  ctx.font = `700 ${18*k}px system-ui, sans-serif`; ctx.textBaseline = 'middle';
  rows.forEach(([n, v], i) => {
    const yy = y + rh*(i+0.7);
    ctx.fillStyle = '#fff'; ctx.fillText(n, x+10*k, yy);
    ctx.fillStyle = '#444'; ctx.fillRect(x+110*k, yy-8*k, 170*k, 16*k);
    ctx.fillStyle = '#7bdc6b'; ctx.fillRect(x+110*k, yy-8*k, 170*k*Math.max(0, Math.min(1, v)), 16*k);
  });

  ctx.fillText(`mouth ${S.mouth.cur}  eyes ${S.eye.cur}  lvl ${openLvl}  ${f.seen ? 'face' : 'NO FACE'}`, x+10*k, y + rh*(rows.length+0.75));
  ctx.restore();
}

function frame(now) {
  track(now);
  drawBackground();
  drawNibble(now);
  drawText();
  drawDebug();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------------------
// On-screen text: flip the switch on, type, hit Enter; each new line replaces the last.
// It's drawn into the picture itself, so it's in recordings and streams. Drag it on the screen to move it.
// ---------------------------------------------------------------------------
const FONTS = [
  ['bonkd', 'Bonkd', "'Lilita One'", 400], ['luckiest', 'Luckiest', "'Luckiest Guy'", 400], ['bangers', 'Bangers', "'Bangers'", 400],
  ['marker', 'Marker', "'Permanent Marker'", 400], ['baloo', 'Baloo', "'Baloo 2'", 800],
];
const COLORS = ['#161616', '#ffffff', '#ffd23f', '#df3a4e', '#8ee26b', '#9fe3fb', '#f48aa8', '#f2a03d'];
const SIZES = { S:0.058, M:0.078, L:0.104 };
const TX = { on:false, text:'', font:'bonkd', color:'#161616', outline:false, box:true, size:'M', x:0.5, y:0.86, placed:false, rect:null };
try { Object.assign(TX, JSON.parse(localStorage.getItem('nf-text') || '{}'), { on:false, text:'', rect:null, x:0.5, y:0.86, placed:false }); } catch (e) {}
if (!FONTS.some(f => f[0] === TX.font)) TX.font = 'bonkd';
function saveTX() { try { const { font, color, outline, box, size } = TX; localStorage.setItem('nf-text', JSON.stringify({ font, color, outline, box, size })); } catch (e) {} }
const fontOf = () => FONTS.find(f => f[0] === TX.font);
const loadedFonts = {};
function ensureFont(f) {
  if (loadedFonts[f[0]]) return;
  loadedFonts[f[0]] = true;
  try { document.fonts.load(`${f[3]} 60px ${f[2]}`); } catch (e) {}
}
const lum = hex => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255; };
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapLines(text, maxW) {
  const words = text.split(/\s+/).filter(Boolean), lines = []; let cur = '';

  if (cur) lines.push(cur); return lines;
}
// The open space around the Nibble: above its head, and to its left and right. Worked out from everywhere the art can
// reach while you move (head turns, tilts, nods, the halo's wobble), so the text never covers the character.
let regionCache = null;
function freeRegions() {
  const C = S.charAt, W = stage.width, H = stage.height, m = Math.min(W, H);
  if (!C || C.W !== W || C.H !== H || !C.o) return [[0, 0, W, H * 0.25]];
  const ck = [W, H, C.id, C.x, C.size].join();
  if (regionCache && regionCache.ck === ck) return regionCache.R;
  const k = C.size / 1000, px = W / 2, py = H;
  let ex0 = Infinity, ey0 = Infinity, ex1 = -Infinity, hx0 = Infinity, hx1 = -Infinity; const hy = H * 0.5;
  for (const r of [-0.14, 0, 0.14]) for (const dx of [-0.03, 0.03]) for (const dy of [-0.015, 0.015]) for (const [ax, ay] of C.o) {
    const u = C.x + ax * k - px, v = (C.y + ay * k - py) * 1.006, xr = u * Math.cos(r) - v * Math.sin(r), yr = u * Math.sin(r) + v * Math.cos(r);
    const fx = px + dx * C.size + xr, fy = py + dy * C.size + yr;
    if (fy > H) continue;
    ex0 = Math.min(ex0, fx); ex1 = Math.max(ex1, fx); ey0 = Math.min(ey0, fy);
    if (fy < hy + m * 0.02) { hx0 = Math.min(hx0, fx); hx1 = Math.max(hx1, fx); }
  }
  const g = m * 0.015, R = [];
  R.push([0, 0, W, ey0 - g]);                              // above the head
  R.push([0, 0, ex0 - g, H]);                              // left of the character
  R.push([ex1 + g, 0, W, H]);                              // right of the character
  if (hx0 - g > ex0) R.push([0, 0, hx0 - g, hy]);          // beside the head, where it's narrower than the shoulders
  if (hx1 + g < ex1) R.push([hx1 + g, 0, W, hy]);
  const ok = R.filter(([x0, y0, x1, y1]) => x1 - x0 > m * 0.2 && y1 - y0 > m * 0.07);
  if (ok.length) { regionCache = { ck, R:ok }; return ok; }
  const area = ([x0, y0, x1, y1]) => Math.max(0, x1 - x0) * Math.max(0, y1 - y0);   // no room anywhere: the biggest gap there is
  const [x0, y0, x1, y1] = R.reduce((a, c) => area(c) > area(a) ? c : a, R[0]);
  return [[Math.max(0, x0), 0, Math.min(W, Math.max(x1, x0 + m * 0.12)), Math.max(y1, m * 0.1)]];
}
function layoutText(region, f, m) {
  const [rx0, ry0, rx1, ry1] = region, mg = m * 0.02, maxW = rx1 - rx0 - 2 * mg, maxH = ry1 - ry0 - 2 * mg, box = TX.box;
  const maxLines = maxH > maxW ? 6 : 3;

  for (let i = 0; i < 30; i++) {   // shrink until it fits inside this open space
    ctx.font = `${f[3]} ${fs}px ${f[2]}, 'Arial Black', sans-serif`;
    const padX = box ? fs * 0.55 : fs * 0.2, padY = box ? fs * 0.42 : fs * 0.2;

    L = { fs, lines, padX, padY, capH, lineH, bw, bh, fits: lines.length <= maxLines && bw <= maxW && bh <= maxH };

let txtCache = null;
function drawText() {
  if (!TX.on || !TX.text) { TX.rect = null; return; }
  const W = stage.width, H = stage.height, m = Math.min(W, H), f = fontOf(); ensureFont(f);
  if (TX.shapeN !== S.shapeN) { TX.shapeN = S.shapeN; TX.placed = false; }   // a new shape starts the text back in its default spot
  const regions = freeRegions();
  const key = [TX.text, TX.font, TX.size, TX.box, W, H, S.id, regions.map(r => r.map(Math.round).join()).join('|'), document.fonts.status].join('/');
  if (!txtCache || txtCache.key !== key) {

    const top = pool.find(c => c.r[1] === 0 && c.r[0] === 0 && c.r[2] === W);

  }
  ctx.font = `${f[3]} ${txtCache.best.L.fs}px ${f[2]}, 'Arial Black', sans-serif`;
  // dragged: it stays in whichever open space your finger is in, kept clear of the character

  if (TX.placed) {
    const qx = TX.x * W, qy = TX.y * H, dist = ([x0, y0, x1, y1]) => Math.hypot(Math.max(x0 - qx, 0, qx - x1), Math.max(y0 - qy, 0, qy - y1));
    pick = txtCache.fits.reduce((a, c) => dist(c.r) < dist(a.r) ? c : a, txtCache.fits[0]);
    ctx.font = `${f[3]} ${pick.L.fs}px ${f[2]}, 'Arial Black', sans-serif`;
  }
  const { r:[rx0, ry0, rx1, ry1], L } = pick, { fs, lines, padX, padY, capH, lineH, bw, bh } = L, box = TX.box, mg = m * 0.02;
  const ax = TX.placed ? TX.x * W : (rx0 + rx1) / 2, ay = TX.placed ? TX.y * H : (ry0 + ry1) / 2;
  const cx = clamp(ax, rx0 + bw / 2 + mg, Math.max(rx0 + bw / 2 + mg, rx1 - bw / 2 - mg));
  const cy = clamp(ay, ry0 + bh / 2 + mg, Math.max(ry0 + bh / 2 + mg, ry1 - bh / 2 - mg));
  const bx = cx - bw / 2, by = cy - bh / 2, sh = fs * 0.09, light = lum(TX.color) > 0.5;
  TX.rect = [bx, by, bw, bh, cx, cy];
  ctx.save();
  if (box) {   // a Bonkd card: ink outline and offset shadow; dark card for light text so it always reads
    const r = Math.min(fs * 0.42, bh / 2), lw = Math.max(3, fs * 0.075);
    ctx.fillStyle = '#161616'; rrect(bx + sh, by + sh, bw, bh, r); ctx.fill();
    ctx.fillStyle = light ? '#161616' : '#ffffff'; rrect(bx, by, bw, bh, r); ctx.fill();

  lines.forEach((l, i) => {
    const y = by + padY + capH + i * lineH;
    if (TX.outline) {
      ctx.strokeStyle = ctx.fillStyle = oc; ctx.lineWidth = ow;
      ctx.strokeText(l, cx + so, y + so); ctx.fillText(l, cx + so, y + so);   // offset shadow, like Bonkd's outlined words
      ctx.strokeText(l, cx, y);
    }
    if (!TX.outline && !box) { ctx.shadowColor = 'rgba(22,22,22,.55)'; ctx.shadowBlur = fs * 0.12; ctx.shadowOffsetX = ctx.shadowOffsetY = fs * 0.04; }   // plain text still reads over any background
    ctx.fillStyle = TX.color; ctx.fillText(l, cx, y);

}

// controls
const txtIn = $('txtIn');
// the page itself never scrolls; if the phone tries to nudge it while the keyboard opens or closes, put it straight back
const pin = () => { if (scrollY || document.documentElement.scrollTop) scrollTo(0, 0); };
addEventListener('scroll', pin, { passive:true });
if (window.visualViewport) visualViewport.addEventListener('resize', pin);
$('txtSwitch').onchange = e => {
  $('txtToggle').classList.toggle('on', e.target.checked);
  TX.on = e.target.checked; TX.text = '';              // switching on starts empty; nothing shows until you send something
  txtIn.disabled = !TX.on; txtIn.value = '';
  txtIn.placeholder = TX.on ? 'Type + Enter' : 'Text is off';
  if (TX.on) txtIn.focus();
};
$('txtForm').onsubmit = e => {
  e.preventDefault(); if (!TX.on) return;
  TX.text = txtIn.value.trim().replace(/\s+/g, ' '); txtIn.value = '';
  if (matchMedia('(pointer:coarse)').matches) txtIn.blur();   // phones: drop the keyboard so the whole screen shows
};
function buildPop() {
  const fr = $('fontRow'), cr = $('colorRow'), sr = $('styleRow');
  fr.innerHTML = cr.innerHTML = sr.innerHTML = '';
  for (const f of FONTS) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chipb' + (TX.font === f[0] ? ' on' : '');
    b.textContent = f[1]; b.style.fontFamily = f[2]; b.style.fontWeight = f[3];
    b.onclick = () => { TX.font = f[0]; ensureFont(f); saveTX(); buildPop(); }; fr.appendChild(b);
  }
  for (const c of COLORS) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'sw' + (TX.color === c ? ' on' : ''); b.style.background = c;
    b.setAttribute('aria-label', 'Color ' + c); b.onclick = () => { TX.color = c; saveTX(); buildPop(); }; cr.appendChild(b);
  }
  const seg = (label, on, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chipb seg' + (on ? ' on' : ''); b.textContent = label;
    b.onclick = () => { fn(); saveTX(); buildPop(); }; sr.appendChild(b); };
  seg('Outline', TX.outline, () => TX.outline = !TX.outline);
  seg('Box', TX.box, () => TX.box = !TX.box);
  const sep = document.createElement('span'); sep.className = 'sep'; sr.appendChild(sep);
  for (const k of Object.keys(SIZES)) seg(k, TX.size === k, () => TX.size = k);
}
buildPop(); FONTS.forEach(ensureFont);
function showPop(open) { $('pop').hidden = !open; $('aaBtn').classList.toggle('on', open); $('aaBtn').setAttribute('aria-expanded', open); }
$('aaBtn').onclick = () => showPop($('pop').hidden);
document.addEventListener('pointerdown', e => { if (!$('pop').hidden && !e.target.closest('#pop, #aaBtn')) showPop(false); });

// drag the text around the screen
let drag = null;
const toCanvas = e => { const r = stage.getBoundingClientRect(); return [(e.clientX - r.left) * stage.width / r.width, (e.clientY - r.top) * stage.height / r.height]; };
const onText = (x, y) => { const R = TX.rect; if (!R) return false; const sl = Math.min(stage.width, stage.height) * 0.04;
  return x > R[0] - sl && x < R[0] + R[2] + sl && y > R[1] - sl && y < R[1] + R[3] + sl; };
stage.addEventListener('pointerdown', e => {
  const [x, y] = toCanvas(e); if (!onText(x, y)) return;
  drag = { dx:x - TX.rect[4], dy:y - TX.rect[5] }; stage.setPointerCapture(e.pointerId); stage.style.cursor = 'grabbing'; e.preventDefault();
});
stage.addEventListener('pointermove', e => {
  const [x, y] = toCanvas(e);
  if (!drag) { stage.style.cursor = onText(x, y) ? 'grab' : ''; return; }
  TX.x = (x - drag.dx) / stage.width; TX.y = (y - drag.dy) / stage.height; TX.placed = true;
});
const endDrag = () => { if (!drag) return; drag = null; stage.style.cursor = '';
  if (TX.rect) { TX.x = TX.rect[4] / stage.width; TX.y = TX.rect[5] / stage.height; } };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);

// ---------------------------------------------------------------------------
// Recording (mic only outside wallet browsers, asked for only when recording)
// ---------------------------------------------------------------------------
async function getMic() {
  if (IN_WALLET) return [];
  if (S.audioTracks.length && S.audioTracks[0].readyState === 'live') return S.audioTracks;
  try { const m = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true }, video:false }); S.audioTracks = m.getAudioTracks(); }
  catch (e) { S.audioTracks = []; }
  return S.audioTracks;
}
$('recBtn').onclick = async () => {
  if (S.recorder) { try { S.recorder.stop(); } catch (e) {} return; }
  if (!stage.captureStream || !window.MediaRecorder) { setStatus('recStatus', 'This browser can\'t record. Try Safari or Chrome.', 'err'); return; }
  try {
    const out = stage.captureStream(30);
    (await getMic()).forEach(tr => { if (tr.readyState === 'live') out.addTrack(tr); });
    const mimeType = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    S.chunks = [];
    S.recorder = new MediaRecorder(out, mimeType ? { mimeType, videoBitsPerSecond:3_000_000 } : undefined);
    S.recorder.ondataavailable = e => e.data && e.data.size && S.chunks.push(e.data);
    S.recorder.onerror = () => { S.recorder = null; $('recBtn').classList.remove('on'); $('recLbl').textContent = 'Record'; $('recBadge').style.display = 'none'; setStatus('recStatus', 'Recording stopped unexpectedly.', 'err'); };
    S.recorder.onstop = () => {
      const type = (S.recorder && S.recorder.mimeType) || mimeType || 'video/webm';
      const blob = new Blob(S.chunks, { type });
      const name = `nibblefilter-${S.id}-${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
      S.recorder = null; fitStage(); $('recBtn').classList.remove('on'); $('recLbl').textContent = 'Record'; $('recBadge').style.display = 'none';
      const t = $('toast'); clearTimeout(toastT); t.className = 'toast'; t.innerHTML = ''; t.style.display = 'block';
      const dl = document.createElement('a'); dl.href = URL.createObjectURL(blob); dl.download = name; dl.textContent = 'Save clip'; dl.className = 'save';
      let file = null; try { file = new File([blob], name, { type }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
        dl.onclick = async ev => { ev.preventDefault(); try { await navigator.share({ files:[file] }); } catch (e) {} };
      }
      const x = document.createElement('a'); x.href = '#'; x.textContent = '✕'; x.className = 'close'; x.setAttribute('aria-label', 'Close'); 
      x.onclick = ev => { ev.preventDefault(); setStatus('recStatus', ''); };
      t.append(dl, x);
    };
    S.recorder.start(1000);
    $('recBtn').classList.add('on'); $('recLbl').textContent = 'Stop'; $('recBadge').style.display = 'block';
    setStatus('recStatus', S.audioTracks.length ? '' : IN_WALLET ? 'Recording without sound (wallet browsers block the mic — open in Safari for sound).' : 'Recording (no mic access, so no sound)…');
  } catch (e) { S.recorder = null; setStatus('recStatus', 'Recording isn\'t supported in this browser. Try Safari or Chrome.', 'err'); }
};

function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return S['_' + k]; } }
function sessionStorageSet(k) { try { sessionStorage.setItem(k, '1'); } catch (e) { S['_' + k] = 1; } }
// ---------------------------------------------------------------------------
// Stream mode: only the Nibble, full screen, for OBS window capture
// ---------------------------------------------------------------------------
$('streamBtn').onclick = async () => {
  if (!sessionStorageGet('streamTip')) { setStatus('x', 'Stream mode: your Nibble fills the screen so OBS can capture this window. Use Green screen + a Chroma Key filter to drop it over a game. Tap again to start.', '', 6000); sessionStorageSet('streamTip'); return; }
  document.body.classList.add('streaming'); wakeExit(); try { await document.documentElement.requestFullscreen?.(); } catch (e) {} };
function exitStream() { document.body.classList.remove('streaming'); if (document.fullscreenElement) document.exitFullscreen(); }
$('exitStream').onclick = exitStream;
let dimT = 0;
function wakeExit() { const b = $('exitStream'); b.classList.remove('dim'); clearTimeout(dimT); dimT = setTimeout(() => b.classList.add('dim'), 4000); }
['pointerdown','pointermove','touchstart'].forEach(ev => document.addEventListener(ev, () => { if (document.body.classList.contains('streaming')) wakeExit(); }, { passive:true }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') exitStream(); });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('streaming'); });
</script>
