name: Fetch a speech model (tests)
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Hugging Face model id, e.g. onnx-community/whisper-base_timestamped'
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research
      - run: |
          M="${{ inputs.model }}"; D="models/$M"; mkdir -p "$D/onnx"
          curl -sSf "https://huggingface.co/api/models/$M/tree/main?recursive=1" > tree.json
          python3 - "$M" <<'PY' > files.txt
          import json, sys
          t = json.load(open('tree.json'))
          for f in t:
              p = f['path']
              if f['type'] != 'file': continue
              if p.endswith('.json') or (p.startswith('onnx/') and ('quantized' in p or p.endswith('_q4.onnx'))): print(p)
          PY
          cat files.txt
          while read p; do curl -sSfL --retry 3 -o "$D/$p" "https://huggingface.co/$M/resolve/main/$p" || echo "fail $p"; done < files.txt
          du -sh "$D"; ls -la "$D" "$D/onnx"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add models && git commit -qm "Model $M" && git push
