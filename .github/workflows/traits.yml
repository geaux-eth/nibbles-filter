name: Trait index
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Token ids, comma separated (blank = all 8888)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Can a web page read the pictures and metadata? (CORS)
        run: |
          for u in https://d24r2edyfve7yo.cloudfront.net/nibbles/images/5502.png https://frankymetadataserver-production.up.railway.app/nibble/metadata/5502; do
            echo "== $u"; curl -sS -o /dev/null -D - -H "Origin: https://geaux-eth.github.io" "$u" | grep -i -E "^(HTTP|access-control|content-type|content-length)" || true
          done
      - run: node tools/traits.mjs
        env:
          IDS: ${{ inputs.ids }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/traits.json data/traits-sample.json data/traits-tally.json
          git commit -m "Trait index from on-chain metadata" || echo "no change"
          git push
